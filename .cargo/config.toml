# zenc depends on halflight, a PRIVATE git repository reached over ssh. On a
# workstation libgit2's own ssh path already works through the agent, measured
# 2026-09-02: with this file removed and the cached checkout deleted, a
# `--locked --manifest-path` build from the repo root fetched fine. What it
# cannot do is read ~/.ssh/config, and that is how the photo-pipeline workflow
# hands cargo a read-only deploy key (an IdentityFile entry written just before
# the build). Fetching through the git CLI honours it. Lives at the root because
# cargo discovers this file from the working directory, and every invocation
# here (the pipeline scripts, CI) runs from the root with --manifest-path.
[net]
git-fetch-with-cli = true
