name = "lens-reader"
main = "src/index.js"
compatibility_date = "2026-07-02"
compatibility_flags = ["nodejs_compat"]

# Deploy-only. Minification measured 2026-08-16: 148.92 -> 113.09 KiB gzip.
# The aligned parser dependency graph measured 80.56 KiB gzip on 2026-08-20.
# Source maps preserve original stack locations in Workers Logs; local Wrangler
# development still reads the authored modules.
minify = true
upload_source_maps = true

# Intercepts /lens/read* ahead of the site Worker, exactly the way cf-garage
# intercepts /garage/cf/*. This is a ROUTE and not a `run_worker_first` entry,
# which is the whole reason the feature lives in its own script: that list is a
# hard 100 and this repo sits at exactly 100 (CLAUDE.md gotcha 26), so a
# /lens/read path on the site Worker would refuse to boot.
routes = [{ pattern = "aadhar.sh/lens/read*", zone_name = "aadhar.sh" }]

# Workers Logs — same free tier the site Worker runs on.
[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# Per-IP budget, mirroring the /lens/* family. Extraction is pure CPU with one
# upstream fetch, so this is cheaper than Browser Run and dearer than a parse:
# the ceiling sits between /lens/browser (4/min) and /lens/fetch (30/min).
[[ratelimits]]
name = "READER_RL"
namespace_id = "3001"
simple = { limit = 10, period = 60 }
