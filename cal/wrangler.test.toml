# Test-only Workers runtime configuration. Production deployment belongs to the
# root aadhar-sh Worker (`../wrangler.jsonc`); this file exists only because the
# Vitest pool needs a small config to emulate the Cal module's KV and vars.
name = "cal-aadhar-sh-tests"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[kv_namespaces]]
binding = "BOOKINGS"
id = "37acb65118fe485583a90a94cb89365e"

# The per-booking expiry timer (cal/src/workflow.ts, re-exported from src/index.js).
# Lets the Vitest pool create + introspect BookingWorkflow instances.
[[workflows]]
name = "cal-booking-expiry"
binding = "BOOKING_WORKFLOW"
class_name = "BookingWorkflow"

[vars]
HOST_TIMEZONE       = "America/New_York"
WORKING_HOURS_START = "9"
WORKING_HOURS_END   = "18"
WORKING_DAYS        = "1,2,3,4,5"
SLOT_MINUTES        = "30"
BUFFER_MINUTES      = "15"
MIN_NOTICE_HOURS    = "24"
MAX_LOOKAHEAD_DAYS  = "14"
DAILY_LIMIT         = "3"
WEEKLY_LIMIT        = "5"
HOST_NAME           = "aadharsh"
HOST_EMAIL          = "coffee@aadhar.sh"
HOST_PUBLIC_URL     = "https://aadhar.sh"
EVENT_TITLE         = "coffee with aadharsh"
PENDING_TTL_DAYS    = "7"
