# Test-only Workers runtime configuration. Production deployment belongs to the
# root aadhar-sh Worker (`../cloudflare.config.ts`); this file exists only because
# cal/test/harness.ts boots the Cal module through wrangler's createTestHarness,
# which needs a small config to emulate its KV and vars.
name = "cal-aadhar-sh-tests"
# Resolved literally, by the harness and by any wrangler command, so a wrong path
# fails cal's suite. It said `src/index.js` from the TypeScript conversion until
# 2026-08-23 while the old Vitest pool, which mapped `.js` onto `.ts`, stayed
# green; tools/contract-every-wrangler-entry-point-exists.test.mjs now checks it.
main = "src/index.ts"
compatibility_date = "2026-06-01"
# Mirrors the root cloudflare.config.ts so the harness boots the module on the
# same loader production runs; the argument for the flag lives there.
compatibility_flags = ["new_module_registry"]

[[kv_namespaces]]
binding = "BOOKINGS"
id = "37acb65118fe485583a90a94cb89365e"

# The per-booking expiry timer (cal/src/workflow.ts, re-exported from src/index.ts).
# Lets the harness create and introspect BookingWorkflow instances.
[[workflows]]
name = "cal-booking-expiry"
binding = "BOOKING_WORKFLOW"
class_name = "BookingWorkflow"

[vars]
HOST_TIMEZONE       = "America/New_York"
WORKING_HOURS_START = "9"
WORKING_HOURS_END   = "18"
WORKING_DAYS        = "1,2,3,4,5"
SLOT_MINUTES        = "30"
BUFFER_MINUTES      = "15"
MIN_NOTICE_HOURS    = "24"
MAX_LOOKAHEAD_DAYS  = "14"
DAILY_LIMIT         = "3"
WEEKLY_LIMIT        = "5"
HOST_NAME           = "aadharsh"
HOST_EMAIL          = "coffee@aadhar.sh"
HOST_PUBLIC_URL     = "https://aadhar.sh"
EVENT_TITLE         = "coffee with aadharsh"
PENDING_TTL_DAYS    = "7"
