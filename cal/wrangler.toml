name = "cal-aadhar-sh"
main = "src/index.js"
compatibility_date = "2026-05-01"

# deployed under TWO route patterns:
#   - aadhar.sh/coffee/*    canonical user-facing URL (matches homepage copy)
#   - cal.aadhar.sh/*       subdomain fallback / direct entrypoint
# the worker auto-detects which prefix was used and emits matching form
# actions and redirect targets (see BASE_PATH handling in src/index.js).
routes = [
  { pattern = "aadhar.sh/coffee",   zone_name = "aadhar.sh" },
  { pattern = "aadhar.sh/coffee/*", zone_name = "aadhar.sh" },
  { pattern = "cal.aadhar.sh/*",    custom_domain = true }
]

# pending booking storage (~hundreds of writes/year at personal volume; well
# within free tier). create with: wrangler kv namespace create CAL_BOOKINGS
[[kv_namespaces]]
binding = "BOOKINGS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# weekly sweep — expire pending bookings older than the configured TTL,
# and reclaim slots that were never approved/declined.
[triggers]
crons = ["0 4 * * 0"]   # sunday 04:00 UTC

[vars]
# everything host-specific lives here. all times in IANA tz names so DST is handled.
HOST_TIMEZONE       = "America/New_York"
WORKING_HOURS_START = "9"      # local hour, 24h
WORKING_HOURS_END   = "18"
WORKING_DAYS        = "1,2,3,4,5"  # mon-fri (0=sunday)
SLOT_MINUTES        = "30"
BUFFER_MINUTES      = "15"
MIN_NOTICE_HOURS    = "24"
MAX_LOOKAHEAD_DAYS  = "14"
DAILY_LIMIT         = "3"
WEEKLY_LIMIT        = "5"
HOST_NAME           = "aadharsh"
HOST_EMAIL          = "coffee@aadhar.sh"
HOST_PUBLIC_URL     = "https://aadhar.sh"
EVENT_TITLE         = "coffee with aadharsh"
PENDING_TTL_DAYS    = "7"

# secrets — set with `wrangler secret put NAME`. never check these in:
#   ICAL_URL          public/secret iCal URL of your *real* calendar (read-only)
#                     google: settings → integrate calendar → "secret address in iCal format"
#                     icloud: cal app → calendar settings → publish → public iCal URL
#   RESEND_API_KEY    https://resend.com → API keys. free tier 3k/mo.
#   SIGNING_SECRET    `openssl rand -hex 32` — used for HMAC on approve/decline links.
#                     keep stable; rotating invalidates pending approval links.
