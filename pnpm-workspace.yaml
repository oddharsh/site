# pnpm's settings file, and the reason package.json no longer carries a
# `workspaces` array: pnpm does not read that field. It reads this one.
#
# `pnpm import` does NOT carry overrides into the lockfile: the first
# `pnpm install --frozen-lockfile` after adding one fails with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH until a single non-frozen install bakes it
# in. That is a one-time step, and the error names the fix.

# GHSA / dependabot #12: nanoid before 3.3.17 spins forever in customAlphabet
# and customRandom when size is 0. It reaches this tree at ONE position and it
# is dev-only, `vitest -> vite -> postcss -> nanoid`, so nothing served by a
# Worker touches it and no code here calls either function. postcss already
# asks for `^3.3.16`, so the range permits the fix and this override exists
# only because pnpm will not move a transitive-only package: `pnpm update
# nanoid -r --depth Infinity` re-resolves 320 other entries and leaves this one
# at its locked version, measured 2026-08-10 across four invocations. Deleting
# the entry by hand is worse than it looks — pnpm reads the shortened lockfile
# as up to date, skips resolution, and prunes nanoid out of postcss entirely.
#
# The SELECTOR is the part worth copying. `nanoid@<3.3.17` matches only the
# versions the advisory names, so this expires on its own: the day postcss
# raises its floor past 3.3.17, or moves to the 5.x/6.x line, the selector
# stops matching and the pin stops applying. An override written as a bare
# `nanoid: 3.3.18` would instead hold every future resolution at a 2026 patch
# release and nothing would say so.
overrides:
  nanoid@<3.3.17: ^3.3.17

packages:
  - cal
  - cf-garage
  - lwe-ask
  - serendipity

# Lifecycle scripts are DENIED by default (pnpm 10+), and pnpm 11 makes an
# unapproved build a HARD ERROR that blocks `pnpm run` as well as `pnpm
# install`. Both entries below were measured to be unnecessary for a working
# build: every native dependency here ships its platform binary through
# optionalDependencies, so `esbuild` and `workerd` both pass their probes with
# their postinstalls blocked. They are approved anyway so the tree matches what
# the packages intend, and so a future dependency that genuinely needs its
# build step fails loudly here instead of silently degrading.
#
# WARNING, and it is the reason PNPM_VERSION is pinned in infra.json: this key
# is pnpm 11 only. pnpm 10 spells it `onlyBuiltDependencies` and silently
# ignores this one, so on a build image running pnpm 10 these postinstalls do
# not run. Harmless today for exactly the reason above. Check it again before
# adding a dependency that needs its build script.
allowBuilds:
  esbuild: true
  # sharp reaches this tree ONLY through miniflare, which uses it to emulate the
  # Images binding both wrangler configs declare, so it is a real local-dev
  # dependency rather than dead weight. It sat here as pnpm's literal `set this
  # to true or false` placeholder, which is the string pnpm writes when it finds
  # an unapproved build and nobody answers. That stopped being cosmetic on
  # 2026-08-14: a `--frozen-lockfile` install now fails with
  # ERR_PNPM_IGNORED_BUILDS naming sharp, so the unanswered prompt breaks the
  # install it was recording.
  #
  # Approved for the same measured reason as its two neighbours, and the
  # measurement was repeated rather than assumed: with the build script blocked,
  # `require("sharp")` still loads and reports 0.35.2, because the platform
  # binary arrives through @img/sharp-<platform> as an optionalDependency and the
  # postinstall is only a probe over it.
  sharp: true
  workerd: true

# A package published in the last 24 hours is REFUSED, which is the window a
# compromised release is most dangerous in and least likely to have been
# noticed. Stated explicitly rather than left to pnpm 11's default, so the
# number is a decision somebody made instead of a behaviour that arrived with a
# version bump. Same reasoning as pinning every action by digest.
#
# The cost lands on dependency bumps, and it lands on CI rather than locally: a
# --frozen-lockfile install re-checks the policy against the COMMITTED lockfile,
# so a dependabot PR opened minutes after a release fails to install until
# either the package turns 24 hours old or its version is listed below.
# `pnpm install` APPENDS to `minimumReleaseAgeExclude` when it needs to, and
# that key is absent here because the list is currently empty rather than
# because it is unused.
#
# It does NOT prune, which is the half this note used to get wrong by saying
# pnpm "regenerates the list". Measured 2026-08-19: the list held 20 entries
# (one workers-types version no longer installed, plus oxc-minify 0.144.0 and
# its 19 platform bindings) and a full `pnpm install` that moved five packages
# left every one of them in place. An append-only list under a comment saying
# do not hand-edit it is a list that grows forever, and each dead entry is a
# standing exemption from the 24-hour policy for a version nobody is installing.
#
# Emptying it was verified rather than assumed, under the condition that
# actually matters: `node_modules` deleted, then `pnpm install
# --frozen-lockfile`, which is what CI runs. Exit 0. Every excluded version had
# long since aged past 1440 minutes, so the exclusions were inert.
#
# So DO hand-edit it, in one direction only: an entry may be removed once its
# version is over 24 hours old, and entries are only ever added by pnpm.
minimumReleaseAge: 1440
