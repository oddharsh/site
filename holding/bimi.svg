<svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <title>aadhar.sh</title>
  <!-- Original paperclip-assistant mascot — a Clippy-spirited homage, not Microsoft's
       Clippit. Drawn for aadhar.sh as a conformant SVG Tiny-PS BIMI logo. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a93e4"/>
      <stop offset="1" stop-color="#1f51b5"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f7fc"/>
      <stop offset="1" stop-color="#b9c8dd"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (BIMI crops to a circle; no transparency) -->
  <rect x="0" y="0" width="480" height="480" fill="url(#sky)"/>

  <!-- the paperclip: two nested stadium loops -->
  <g fill="none" stroke="url(#wire)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="168" y="150" width="144" height="230" rx="72" ry="72" stroke-width="27"/>
    <rect x="204" y="190" width="72" height="150" rx="36" ry="36" stroke-width="19" stroke="#aebccf"/>
  </g>

  <!-- inquisitive eyebrows -->
  <g stroke="#2f3946" stroke-width="15" stroke-linecap="round">
    <line x1="178" y1="160" x2="230" y2="143"/>
    <line x1="250" y1="143" x2="302" y2="160"/>
  </g>

  <!-- googly eyes, looking down-right (curious + helpful) -->
  <g>
    <circle cx="205" cy="198" r="33" fill="#ffffff"/>
    <circle cx="275" cy="198" r="33" fill="#ffffff"/>
    <circle cx="212" cy="206" r="14" fill="#20242b"/>
    <circle cx="282" cy="206" r="14" fill="#20242b"/>
    <circle cx="207" cy="201" r="4" fill="#ffffff"/>
    <circle cx="277" cy="201" r="4" fill="#ffffff"/>
  </g>
</svg>
