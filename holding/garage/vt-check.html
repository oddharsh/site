<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2D78BD">
<link rel="preload" as="style" href="/luna.css">
<title>aadhar.sh/garage/vt-check — cross-document View Transition diagnostic</title>
<meta name="robots" content="noindex">
<!-- a diagnostic MULE, deliberately minimal: no nav.js, no luna.css, no shell.
     It tests the PLATFORM, not the site — if this bare pair transitions but the
     real shell doesn't, the problem is ours; if even this pair cuts, the
     browser lacks (or disables) cross-document View Transitions. -->
<style>
@view-transition { navigation: auto; }
html { background: linear-gradient(180deg, #2D78BD, #6ba3e0); min-height: 100%; }
body { font: 14px/1.6 Verdana, Tahoma, sans-serif; color: #fff; max-width: 560px; margin: 8vh auto; padding: 0 16px; }
h1 { font: bold 18px "Trebuchet MS", Verdana, sans-serif; }
.card { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.4); padding: 12px 16px; margin: 12px 0; }
code, .v { font-family: "Courier New", monospace; }
.y { color: #9f9; } .n { color: #fbb; }
a { color: #fff; }
.go { display: inline-block; background: #fff; color: #1a4ba8; font-weight: bold; padding: 8px 18px; text-decoration: none; border-radius: 3px; margin-top: 8px; }
</style>
</head>
<body>
<h1>View Transition diagnostic (page A)</h1>
<p>This page and its pair carry only <code>@view-transition { navigation: auto }</code>.
Click through; page B reports whether the browser actually ran the transition.</p>

<div class="card" id="support">checking…</div>
<div class="card" id="shell">checking the shell breadcrumb…</div>

<a class="go" id="go" href="/garage/vt-b">Navigate to page B →</a>

<script>
// record at swap-out whether the browser attached a ViewTransition to this nav
addEventListener("pageswap", (e) => {
  try { sessionStorage.setItem("vt-min-swap", e.viewTransition ? "1" : "0"); } catch (_) {}
});

const el = document.getElementById("support");
const yn = (b) => b ? '<span class="y v">yes</span>' : '<span class="n v">NO</span>';
el.innerHTML =
  "cross-document VT rule support (CSSViewTransitionRule): " + yn("CSSViewTransitionRule" in window) + "<br>" +
  "same-document VT (document.startViewTransition): " + yn(!!document.startViewTransition) + "<br>" +
  "speculation rules (prerender): " + yn(!!(HTMLScriptElement.supports && HTMLScriptElement.supports("speculationrules"))) + "<br>" +
  "prefers-reduced-motion: " + (matchMedia("(prefers-reduced-motion: reduce)").matches ? '<span class="n v">reduce (transitions off!)</span>' : '<span class="y v">no-preference</span>') + "<br>" +
  "engine: <span class=v>" + (navigator.userAgent.match(/(Chrome|Version)\/[\d.]+/g) || []).join(" · ") + "</span>";

// the shell breadcrumb: nav.js records whether the LAST real-site navigation
// (taskbar click etc.) had a ViewTransition attached at swap time
const sh = document.getElementById("shell");
try {
  const b = sessionStorage.getItem("axp-vt-swap");
  sh.innerHTML = "last SHELL navigation transitioned: " +
    (b === "1" ? '<span class="y v">yes</span>'
     : b === "0" ? '<span class="n v">NO — the swap had no ViewTransition</span>'
     : '<span class=v>unknown (click a taskbar link somewhere on the site first, then come back)</span>');
} catch (_) { sh.textContent = "sessionStorage unavailable"; }
</script>
</body>
</html>
