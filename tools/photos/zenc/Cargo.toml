[package]
name = "zenc"
version = "0.1.0"
edition = "2021"
description = "The site's JPEG thumbnail encoder (zenjpeg hybrid trellis + progressive scan search) and the per-photo histogram bake. Replaces the from-source cjpegli build and photo-histograms.py; dependabot tracks the zenjpeg pin."
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "zenc"
path = "src/main.rs"

[[example]]
name = "memory-encode"

[features]
heif-experiment = []

[[example]]
name = "heif-memory"
required-features = ["heif-experiment"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dependencies]
# The encoder. hybrid trellis (auto_optimize) needs `trellis`.
#
# `parallel` CAME OUT on 2026-08-24, measured rather than reasoned about. It was
# carried on the claim that it "speeds the 2000px square inputs", which was never
# a number, and on the tier it named it is worth 1.1%:
#
#   600px thumbnail, q84         +2.7%   (+1.5 ms/photo, 9 alternating trials)
#   2000px archive, q100 4:2:2   +1.1%   (+11 ms/image, 5 alternating trials)
#
# For that it cost SIX crates (rayon, rayon-core, crossbeam-deque, -epoch,
# -utils, either) and 194,704 bytes of binary, 10.8% of it. zenc's own source
# never touches rayon; the feature only reaches zenjpeg's internals, which is
# why it buys so little on images this size.
#
# The reason it is safe to drop is that OUTPUT DOES NOT MOVE: byte-identical on
# 6 of 6 thumbnails and 4 of 4 archives. `/i/` is content-addressed, so a
# changed byte would re-mint 632 files and obsolete every baked histogram
# (gotcha 46). It changes nothing.
#
# Re-add it only with a measurement on the tier that motivates it, and check
# byte-identity in the same run. dependabot (cargo ecosystem) owns the pin.
zenjpeg = { version = "0.8.4", features = ["trellis"] }
# The resampling kernel and the sRGB / gamma-2.2 transfer, which lived in this
# crate as src/resample.rs until 2026-09-02 and ship standalone now, MIT, at
# github.com/oddharsh/halflight. A git dependency pinned to a full rev rather
# than a crates.io version because halflight is not published there; the rev
# is the identity and Cargo.lock records it. Swapping the module for the crate
# moved no output byte: every /i/ tier of 52 real photos (both sensors, both
# transfer curves) and the histogram bake over all 165 stems came back
# identical from the binary built either way, and the same A/B is the gate for
# moving this rev.
#
# Moved 2026-09-22 to 871487e for resample_oriented, which square now calls so
# no upright copy of a full frame is built. `bun run zenc:bench` is that A/B
# now: all 24 square outputs and 258 histograms byte-identical, and the
# histograms regenerated from this build matched the committed file. Pin the
# rev to halflight's branch commit and merge that PR with a merge commit (not a
# squash), as #1 was, so this sha stays reachable from halflight's main.
halflight = { git = "https://github.com/oddharsh/halflight.git", rev = "871487e15be16dae0da39ddd882d94d188a5dc5f" }
# Input decode only. `tiff` was added on 2026-08-25 for the Instagram export,
# which needs a LOSSLESS decode of a HEIF source and cannot use JPEG for it.
# Measured on a 7728x5152 HIF: `sips -s format png` takes 6222ms because it
# deflates 160MB, and `sips -s format tiff` takes 585ms because it does not.
# 10.6x on the slowest step of that tool, for four crates, and dropping
# zenjpeg's `parallel` feature had just freed six.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
# The histogram bake's only new dependency, and it replaces a whole python3 + pip
# prerequisite. preserve_order keeps an existing meta file's key order across the
# read/modify/write, which is what python dicts did for free and what makes the
# re-bake a no-op diff instead of a 158-file reshuffle.
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
opt-level = 3
