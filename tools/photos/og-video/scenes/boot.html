<!doctype html>
<!-- boot.html: the homepage's og:video, an XP-style boot screen that never
     finishes booting. A recording scene for record.ts, never served. Homage
     rather than a copy: no Microsoft flag or wordmark, the owner's name and
     the site's in their place, and the one thing everybody remembers, three
     blue chunks sweeping a rounded bar.

     It loops on the boot screen alone. One sweep is 1.5 s, a whole 45 frames
     at 30 fps, and the clip is three of them (4.5 s), so the last frame runs
     into the first with no seam. Frame 0 is baked to public/og/home.jpg as the
     still, so the poster a fetcher shows before playing is the clip's own start. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; }
      #scene { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #000;
        display: grid; place-content: center; justify-items: center; gap: 46px; font-family: "Trebuchet MS", Tahoma, sans-serif; color: #fff; }

      /* the wordmark: a small name over a big one with an orange superscript, the
         shape of the XP boot logo's text block */
      .mark { display: grid; justify-items: start; }
      .owner { font-size: 21px; letter-spacing: 0.5px; margin-left: 6px; opacity: 0.92; }
      .name { font-size: 104px; font-weight: bold; letter-spacing: -2px; line-height: 0.95; }
      .name sup { font-size: 46px; color: #f28e2b; font-style: italic; letter-spacing: 0; vertical-align: 52px; margin-left: 6px; }

      /* the bar: a rounded, grey-ringed slot with three chunks crossing it. The
         sweep starts and ends with the chunks outside the slot, so any phase loops. */
      .bar { position: relative; width: 300px; height: 26px; border: 2px solid #b2b4bf; border-radius: 7px; overflow: hidden; }
      .chunks { position: absolute; top: 3px; left: -76px; display: flex; gap: 4px; }
      /* body.go starts the sweep 0.75 s in, the chunks centred in the slot, and
         the recorder starts its clock there too (clockFromSteps), so frame 0,
         which is also the homepage's og:image, is the bar mid-sweep */
      body.go .chunks { animation: sweep 1.5s linear -0.75s infinite; }
      .chunks i { width: 20px; height: 16px; border-radius: 2px; background: linear-gradient(#5d84f0, #2a44c8 55%, #3456d8); }
      .legal { position: absolute; left: 34px; bottom: 26px; font-size: 15px; color: #c9c9c9; }
      @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(376px); } }
    </style>
  </head>
  <body>
    <div id="scene">
      <div class="mark">
        <span class="owner">Pannirselvam</span>
        <span class="name">aadhar<sup>.sh</sup></span>
      </div>
      <div class="bar">
        <div class="chunks"><i></i><i></i><i></i></div>
      </div>
      <span class="legal">resto-mod, est. 2006-ish</span>
    </div>
  </body>
</html>
