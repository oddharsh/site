name = "cf-garage"
main = "src/index.js"
compatibility_date = "2026-06-16"
compatibility_flags = ["nodejs_compat"]

# Pinned because these deploy from their OWN directory, so wrangler resolves the
# account from this file rather than from the root wrangler.jsonc. It auto-selects
# only while the login sees exactly one account, and a second appeared on 2026-08-07.
# Until this line existed the answer came from ~/.wrangler/cache/wrangler-account.json,
# which an interactive prompt writes, so a fresh clone or a cleared cache broke the
# deploy. Must equal wrangler.jsonc's account_id; check-infra.mjs fails on drift.
account_id = "1c99acdb6141579023fb97d24261ea58"

# intercepts /garage/cf/* ahead of the site Worker (which serves the rest of /garage/*)
routes = [{ pattern = "aadhar.sh/garage/cf/*", zone_name = "aadhar.sh" }]

# Workers Logs — free observability (200k events/day)
[observability]
enabled = true

# Workers tracing — records request traces (incl. our custom spans) in the
# Observability dashboard. powers the /garage/cf/trace custom-spans demo.
[observability.traces]
enabled = true
head_sampling_rate = 1

# Workers AI (image captioning demo)
[ai]
binding = "AI"

[vars]
# Routes the caption call through AI Gateway, which since the 2026-08 Workers AI /
# AI Gateway unification is the same control plane rather than a separate product:
# one `env.AI.run` grows a third argument and the account gets request/response
# payloads, per-model token counts, and cost attribution with no dashboard setup.
#
# A VAR rather than a const in the source, because the id names a resource this
# repo cannot create (no deploy path here may mint Cloudflare resources) and a
# missing gateway would fail a LIVE demo endpoint. Emptying this string is the
# off-switch, one line, no code change and no redeploy of logic.
AI_GATEWAY = "default"

# Browser Rendering (screenshot demo) — needs the binding enabled on the zone
[browser]
binding = "BROWSER"

# Durable Object (atomic visitor counter demo) — SQLite-backed (free tier)
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

[dependencies_instrumentation]
enabled = true
