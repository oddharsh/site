version: 2
updates:
  # Wrangler is a deploy tool for every Worker in this npm workspace. Keep
  # its one exact root pin current and let the normal CI gate validate it.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:17"
      timezone: America/New_York
    open-pull-requests-limit: 1
    allow:
      - dependency-name: wrangler
    labels:
      - dependencies
      - wrangler
    commit-message:
      prefix: chore
      include: scope
