version: 2
updates:
  # NO npm BLOCK, ON PURPOSE, since 2026-10-06. Read this before adding one back.
  #
  # Dependabot cannot update this tree's npm dependencies today, from either
  # side. The `npm` updater has refused any directory holding a bun.lock since
  # dependabot-core#16220 (merged 2026-09-25): every daily `npm_and_yarn` job
  # for `/` and `/lens-reader` failed from that morning on, while the cargo and
  # actions jobs kept opening PRs, so the queue never looked empty and the gap
  # ran 11 days before a fix. The `bun` updater is no way out either: it declares
  # `BunPackageManager::MAX_SUPPORTED_LOCKFILE_VERSION = 1`, both lockfiles here
  # are version 2 (bun 1.4's default), and over that ceiling it opens nothing
  # (dependabot-core#16026, open).
  #
  # .github/workflows/deps-pin.yml does the npm half instead, nightly:
  # `bun run deps:pin` reads the registry, applies the same 24-hour release age
  # bunfig.toml enforces, keeps the groups this file used to declare (now in
  # tools/lib/deps-plan.ts with their reasons), relocks, moves the version
  # claims in docs/DEPENDENCIES.md, and opens one PR per group. It also runs
  # `bun audit`, because security updates went quiet with the version ones.
  #
  # When dependabot-core raises that constant to 2, the move back is
  # `package-ecosystem: bun` for `/` and `/lens-reader` with the groups copied
  # from deps-plan.ts, and deps-pin.yml can go. The bun updater writes bun.lock
  # itself, so the relock workflow this file once leaned on does not come back.
  #
  # Dependabot ALERTS still cover every npm manifest: the dependency graph
  # reads them regardless of this file. Only the update PRs moved.
  # Keep the action toolchain current too; its PRs get the same review note.
  #
  # `directories` RATHER THAN `directory`, BECAUSE "/" DOES NOT REACH A COMPOSITE
  # ACTION IN A SUBDIRECTORY. Read out of dependabot-core's own fetcher
  # (github_actions/lib/dependabot/github_actions/file_fetcher.rb) on 2026-08-24
  # rather than inferred from the docs, which say only "set the directory to /
  # to check for workflow files in .github/workflows" and leave the rest open:
  # at "/" it fetches `action.yml` and `action.yaml` AT THE REPOSITORY ROOT plus
  # every `*.yml` under `.github/workflows`, and for any other directory it
  # fetches the yaml in that one directory. `.github/actions/setup-bun` is in
  # neither set, so it has never been watched.
  #
  # It costs nothing TODAY, which is the argument for closing it now rather than
  # when it bites. That action is four lines of shell and names no `uses:`, so
  # the gap has no symptom to notice, and the first symptom available to it is
  # an unpinned third-party action sitting in CI that nobody was updating. The
  # glob is what makes this coverage instead of one more hand-maintained entry,
  # and globbing is supported by `directories` where `directory` refuses it.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    # `labels:` REPLACES Dependabot's defaults rather than adding to them, and a
    # name GitHub does not have is dropped in silence. This key read
    # `github-actions`, a label that has never existed in this repository, so
    # every bump from this block traded the working `dependencies` label for
    # nothing. Measured on #620 (a github-actions bump): it carried only the two
    # labels triage.yml gives it, while #622 (an npm bump, no `labels:` key)
    # carried `dependencies` and `javascript` from the defaults. `gh pr create
    # --label` fails outright on an unknown name; Dependabot does not, so the
    # symptom is a missing label rather than an error.
    #
    # It stays explicit rather than being deleted, on the argument bunfig.toml
    # makes for minimumReleaseAge: a stated decision beats a behaviour that
    # arrives with a version. check-infra.ts reads every name here against the
    # label set config/infra.json declares, so a third spelling fails a PR.
    labels:
      - dependencies
    # The same 24h window, on the weaker of the two arguments. No bun install
    # relocks an action pin, so nothing here fails the way the npm blocks do;
    # what carries it is the half of the bunfig comment that is not about bun at
    # all, that a release is most dangerous and least noticed on its first day.
    # An action is the most attractive target in this repository, since it runs
    # with a token in CI on every push. `semver-*-days` is NOT supported for
    # this ecosystem, unlike npm, cargo and pip, so `default-days` is the whole
    # vocabulary available here.
    cooldown:
      default-days: 1
    groups:
      # Actions are SHA-pinned, so a bump is a 40-char diff with no semantics to
      # read per action. Batching them is strictly less review for the same
      # coverage. Verified 2026-08-19: all six pins were already current, and
      # the codeql-action pin is NEWER than the latest tagged bundle, so read a
      # "behind" reading from a tag comparison with suspicion - `git/ref/tags`
      # returns the TAG OBJECT sha for an annotated tag, never the commit.
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  # The JPEG thumbnail encoder (tools/photos/zenc) pins zenjpeg via Cargo.
  # This is what retired the hand-rolled jpegli refresh workflow: dependabot now
  # owns the production encoder's update cadence, same as every other toolchain.
  - package-ecosystem: cargo
    directory: "/tools/photos/zenc"
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
