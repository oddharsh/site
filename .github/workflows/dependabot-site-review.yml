name: Annotate Dependabot site review

# `synchronize` is deliberately absent. It fired a runner on every push to a
# Dependabot branch and rewrote the note with byte-identical text, because a
# force-push from Dependabot is a rebase and a rebase does not change the
# version pair the note reports.
#
# THE SECOND HALF OF THAT ARGUMENT EXPIRED ON 2026-08-19 AND THIS COMMENT KEPT
# MAKING IT UNTIL 2026-08-24. It said a genuinely newer version arrives as a NEW
# pull request under `open-pull-requests-limit: 1`, which `opened` already
# catches. That limit is gone: the npm block runs a limit of 10 with five
# groups, and a grouped pull request is force-pushed IN PLACE when one member
# moves. So the case the next paragraph calls residual is the ordinary one for
# any grouped bump, and the note lags by however long the group keeps moving.
#
# It stays absent anyway, on the fallback that was always the real backstop
# rather than on the dead premise. The note would name the old pair while
# Dependabot's own description names the new one, and the description is the
# authoritative half, since it carries the upstream release notes this checklist
# exists to send you toward. A runner per push to rewrite a checklist that links
# somewhere more current is the wrong side of that trade.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  annotate:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'oddharsh/site'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Add or refresh the site review note
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = "<!-- dependabot-site-review -->";
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const body = `${marker}
            ## Dependabot site review

            **Dependency:** ${process.env.DEPENDENCY_NAMES || "unknown"}
            **Change:** ${process.env.PREVIOUS_VERSION || "?"} → ${process.env.NEW_VERSION || "?"}
            **Type:** ${process.env.DEPENDENCY_TYPE || "unknown"} (${process.env.UPDATE_TYPE || "unknown"})

            Dependabot's PR description contains the upstream release notes/changelog and commit details. Review those before merging.

            ### Site leverage checklist

            - [ ] Checked for new Cloudflare/Workers/R2/KV/D1/Workers Builds capabilities.
            - [ ] Checked bundle, runtime, browser-support, and performance-budget impact.
            - [ ] Checked whether this changes the photo or CI toolchain.
            - [ ] Recorded a concrete leverage or an explicit “none” in review.
            `;
            const prior = comments.find((comment) => comment.body?.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
