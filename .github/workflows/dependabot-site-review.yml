name: Annotate Dependabot site review

# Reads what a Dependabot bump changed, against how this tree uses the package,
# and posts the answer on the pull request. tools/review-dependency-bump.ts is
# the whole of it; this file is the trigger, the credential and the event.
#
# Until 2026-09-15 this job posted a static checklist ("check for new Workers
# capabilities, check the perf budget, record a leverage or an explicit none"),
# which named the reading without doing any of it. The script now fetches the
# releases, the commits between the two tags, the CHANGELOG slice and the
# advisories against the old version, hands them to a model beside this tree's
# own usage of the package, and renders the structured answer under the same
# comment marker. The reasoning about what it reads and what it trusts is at
# the top of the script, not here.
#
# `pull_request_target` rather than `pull_request`, for two reasons that both
# matter. A Dependabot pull request under `pull_request` gets a read-only
# token and DEPENDABOT secrets, not repository secrets, so it could neither
# comment nor reach the model credential. Under `pull_request_target` the job
# runs as the base branch: repository secrets, a token that can comment, and a
# checkout of the BASE sha, which is the property the usual hazard turns on.
# Nothing here checks out the head. The script reads this tree at the base
# (the usage the model is shown) and the PR's body and metadata through the
# API, so a bump cannot rewrite the context that judges it, and the model it
# feeds has no tools to act on anything it reads.
#
# `synchronize` is PRESENT since 2026-09-15, and the argument that kept it
# absent has a different answer now. A rebase force-push from Dependabot
# re-fires it with the same version pairs, which used to mean a runner
# rewriting byte-identical text and would now mean a model call for nothing.
# The script records the pairs it wrote for inside the comment and exits 0
# without a token spent when they match; a grouped bump whose member moved
# (the case dependabot-relock.yml describes, a force-push in place rather than
# a new pull request) re-reads. So the note follows the description, which is
# the authoritative half, rather than lagging it.
#
# THE SECRET is `CLAUDE_CODE_OAUTH_TOKEN`, a REPOSITORY secret (Settings,
# Secrets and variables, Actions) minted by `claude setup-token` on a
# workstation. The model is reached through Claude Code's print mode rather
# than the Messages API, and that is a credential decision: an API key bills
# per token, so a job on a public repository would spend money on every
# Dependabot push, while a setup-token authenticates a subscription seat, is
# what Anthropic's own action documents for this use, and fails as a rate
# limit rather than an invoice. It cannot touch Cloudflare, so the
# no-write-token rule at the top of CLAUDE.md is untouched. Absent, the script
# posts a note saying no model ran and exits 0, so a PR without the secret
# reads as unreviewed rather than as clean. A refused model call posts the
# same note and exits 1, so an outage shows in the Actions tab. This check is
# not required and gates nothing; keep it that way.
#
# The CLI is installed PINNED, from npm through bun, in this job alone. The
# package's postinstall is refused by bun's default-deny (trustedDependencies
# names three packages and this is not one) and the platform binary still
# resolves through the shim, measured 2026-09-15 on 2.1.270. Bump the pin by
# hand; it is not in package.json on purpose, because a 200 KB launcher plus a
# native binary is a cost for every `bun install` and this is the only caller.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-site-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'oddharsh/site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The BASE sha, which is what `pull_request_target` checks out by default.
      # Stated explicitly so a later edit that adds `ref: ${{ ... head.sha }}`
      # has to delete a line that says why not.
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Claude Code
        run: |
          bun install -g @anthropic-ai/claude-code@2.1.270
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/claude" --version

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Read the bump against this tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: bun run deps:review "$PR_NUMBER"
