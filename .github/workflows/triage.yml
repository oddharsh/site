name: Triage

# Assign a new issue or pull request to the owner, and label it from what the
# repository already encodes: the conventional-commit prefix in the title, and
# the paths in the diff. Both the routing rules and the label set are declared
# in config/infra.json under `repository.triage`; read that block's $comment
# before changing anything here, because check-infra asserts the two agree.
#
# THIS GATES NOTHING. It is not a required check and `validate` does not wait
# for it. It does FAIL LOUDLY on an API error rather than swallowing one, for
# the reason the ramp tripwire in ci.yml is advisory-but-visible: a triage step
# that quietly declines to label reports exactly like a repository nobody has
# labelled yet, and the whole point of the block below is that the absence of a
# label should mean something.
#
# `pull_request_target` rather than `pull_request`, for the reason
# dependabot-site-review.yml uses it: a fork or Dependabot pull request running
# under `pull_request` gets a read-only token and cannot label itself. Nothing
# here checks out the head, so the usual `pull_request_target` hazard does not
# apply — and the routing rules are deliberately read at the BASE sha, so a
# pull request cannot rewrite the rules that classify it.
#
# WHAT THIS CANNOT SEE, and it is not a bug here: an event created with the
# default GITHUB_TOKEN does not trigger another workflow, so the pull requests
# dictionary-roll.yml, bun-pin.yml and og-cards.yml open for themselves, and
# the issue node-support-window.yml files, never reach this workflow. Those four
# pass `--assignee` and `--label` to `gh` at creation instead. That is why a
# label rename here is not free: `gh pr create --label` fails outright on an
# unknown label, so it would break the nightly roll rather than mislabel it.
# check-infra reads those flags out of the workflow files and fails on any label
# they name that infra.json does not declare.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [opened, reopened]

permissions:
  contents: read # read config/infra.json at the base ref
  issues: write
  pull-requests: write

jobs:
  triage:
    if: github.repository == 'oddharsh/site'
    runs-on: ubuntu-latest
    steps:
      - name: Assign and label from the declared routing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const target = pr ?? context.payload.issue;
            const issue_number = target.number;

            // The BASE sha for a pull request, the default branch for an issue.
            // Reading the head would let a pull request ship its own triage
            // rules, which is the one thing a `pull_request_target` job must
            // never take from the contributor side.
            const ref = pr?.base?.sha ?? context.payload.repository.default_branch;
            const file = await github.rest.repos.getContent({
              owner, repo, path: "config/infra.json", ref,
            });
            const infra = JSON.parse(Buffer.from(file.data.content, "base64").toString("utf8"));
            const triage = infra.repository?.triage;
            if (!triage) throw new Error("config/infra.json carries no repository.triage block");

            // ---- assign -------------------------------------------------
            // Only when nobody is assigned. A reopened issue somebody handed to
            // a collaborator must not be silently taken back.
            if (!target.assignees?.length) {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number, assignees: [triage.assignee],
              });
            }

            // ---- label --------------------------------------------------
            // One glob dialect, matched against the full repo-relative path:
            // `**/` swallows zero or more segments, a trailing `**` takes the
            // rest, `*` stops at a separator, and a leading `!` excludes (which
            // is how `area: tools` yields tools/photos to `area: photos`).
            const globToRegExp = (glob) => {
              let re = "";
              for (let i = 0; i < glob.length; i++) {
                const c = glob[i];
                if (c === "*") {
                  if (glob[i + 1] === "*") {
                    if (glob[i + 2] === "/") { re += "(?:.*/)?"; i += 2; }
                    else { re += ".*"; i += 1; }
                  } else re += "[^/]*";
                } else if (c === "?") re += "[^/]";
                else re += c.replace(/[.+^${}()|[\]\\]/g, "\\$&");
              }
              return new RegExp(`^${re}$`);
            };

            // A pull request's files, or none for an issue. listFiles caps at
            // 3000 server-side; a dictionary roll runs well past that, so the
            // count is logged rather than assumed complete. Area labels on such
            // a pull request are a floor, never the whole set.
            let files = [];
            if (pr) {
              files = (await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: issue_number, per_page: 100,
              })).map((f) => f.filename);
              core.info(`${files.length} changed file(s) read`);
            }

            // The title carries the type, the diff carries the area. Asking
            // each source only the question it can answer is why neither
            // needs a fallback.
            const prefix = /^([a-z]+)(\([^)]*\))?!?:/.exec(target.title)?.[1];
            const wanted = new Set();

            for (const label of triage.labels) {
              if (label.title?.includes(prefix)) wanted.add(label.name);
              if (!label.paths || !files.length) continue;
              const include = label.paths.filter((p) => !p.startsWith("!")).map(globToRegExp);
              const exclude = label.paths.filter((p) => p.startsWith("!")).map((p) => globToRegExp(p.slice(1)));
              const hit = files.some((f) =>
                include.some((re) => re.test(f)) && !exclude.some((re) => re.test(f)));
              if (hit) wanted.add(label.name);
            }

            // Additive only. A label a human put on stays on: this workflow
            // classifies, it does not curate.
            const already = new Set((target.labels ?? []).map((l) => l.name ?? l));
            const add = [...wanted].filter((n) => !already.has(n));
            core.info(`labels: ${add.length ? add.join(", ") : "nothing to add"}`);
            if (add.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: add });
            }
