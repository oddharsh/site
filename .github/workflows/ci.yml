name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual re-run, because `validate` is the ONLY required check on main and
  # there was no way to start one that never started. 2026-08-06: an Actions
  # outage ("Failed to resolve action download info. Error: Service
  # Unavailable") left a run stuck in `queued` that the API refused to cancel —
  # "Cannot cancel a workflow run that is completed" — and because the
  # concurrency group below is keyed on the PR number, that zombie swallowed
  # every later event on the same PR. Re-running was impossible (the run "cannot
  # be retried"), closing and reopening the PR fired nothing, and an empty commit
  # fired CodeQL and Workers Builds but not CI. A blocked PR with no lever is a
  # bad place to discover you have no lever.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to validate (defaults to the branch you launch from)"
        required: false
        type: string

permissions:
  contents: read
  # Listing workflow runs, for the parked-ramp tripwire below and nothing else.
  # It is the documented key for that endpoint rather than one that merely sounds
  # right, which this file has been burned by once already (see the
  # security-events note directly below). A read, on a public repo, of data the
  # Actions tab shows anyone.
  actions: read
  # Deliberately NOT `security-events: read`. It was added on 2026-08-07 for
  # infra:check's CodeQL default-setup assertion and measured to do nothing: that
  # endpoint needs the repository *Administration* permission, which is not one of
  # the keys a workflow may grant its GITHUB_TOKEN, so the call still returned 403.
  # The assertion is workstation-only by construction. Do not re-add this line
  # expecting it to turn the check on.

concurrency:
  # A dispatch deliberately does NOT share the PR's group. The whole reason this
  # trigger exists is to get past a poisoned group, so joining it would inherit
  # the problem it is here to route around.
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on pull_request/push, where checkout's own default is correct.
          # Only a manual run can name a ref, and then it is the point.
          ref: ${{ inputs.ref || '' }}

      - name: Set up bun
        # config/... no longer applies: the version lives in packageManager and the
        # action reads it, so there is one declaration of which bun this repo runs.
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install homepage dependencies
        run: bun install --frozen-lockfile

      - name: Check deduplicated dependency graph
        run: bun run deps:dedupe

      - name: Check Wrangler versions and lockfiles
        run: bun run check-wrangler

      - name: Build homepage
        run: bun run build

      - name: Check photo asset invariants
        run: bun run photos:check

      # Does every committed derived artifact still describe the bytes it was made
      # from? photos:check above cannot answer that for the histograms, because it
      # compares histograms.json against images/meta/, which the build derives FROM
      # histograms.json: two sides of one source agree whatever the pixels say. This
      # hashes the INPUTS instead, so a re-encode that skips the bake is caught here
      # rather than nine days later (gotcha 41). No generator runs and nothing is
      # written, so it is safe on a shared tree and needs no photo toolchain.
      - name: Check derived artifacts against their inputs
        run: bun run derive:check

      - name: Enforce homepage performance budget
        run: bun run perf-budget

      - name: Validate site Worker config
        run: bun x --no-install wrangler deploy --dry-run

      # Lint, syntax AND type-aware, in one pass. tsgolint (the Go type checker
      # behind `--type-aware`) tracks TypeScript 7.0.2, which is the version
      # pinned below, and that pairing is not a coincidence: TypeScript 7.0 ships
      # no stable programmatic API, so typescript-eslint cannot run on it at all.
      # oxlint reaches the same type-aware rules through tsgolint instead.
      #
      # It runs FIRST because it is the cheapest thing in this job (0.56s locally,
      # against 1.1s for the typecheck it precedes) and because a dead binding is
      # a cheaper thing to read than whatever it causes further down.
      - name: Lint
        run: bun run lint

      # Type checking WITHOUT TypeScript: tsc reads the JSDoc already in these
      # files, emits nothing, and never touches a served byte. Scoped to cal/src
      # today (see tsconfig.json for the measured error counts of the scopes it
      # is meant to grow into). It runs BEFORE the tests because a type error is
      # cheaper to read than the failure it would cause downstream.
      - name: Typecheck annotated JavaScript
        run: bun run typecheck

      - name: Test homepage representation contracts
        run: bun run test

      # THE SAME SUITE UNDER NODE, and it is here because it was not.
      # CLAUDE.md credits the twin with a real find (bun's spec-strict Response
      # rejecting a body the suite reused, which undici allowed), and the script
      # has existed since the migration — but nothing ran it, so the whole claim
      # rested on somebody remembering. A test that only runs on a workstation
      # protects the workstation.
      #
      # It caught its first regression the day it was wired: #497 moved the ref
      # scanner onto HTMLRewriter, a bun global, and the node twin went red while
      # CI stayed green. That test now declares its runtime and skips explicitly.
      - name: The same contracts under Node
        run: bun run test:node

      # The route oracle, pre-merge. createTestHarness() boots the site Worker
      # in-process (honouring wrangler.jsonc's build.command, so it serves the
      # minified .build/public tree) and verify-routes.mjs sweeps it. This is
      # status + content-type + markers for real; it is NOT a data check, since
      # local KV/R2/D1 come up empty. See MAINTENANCE.md "Verify the whole route
      # surface" for what the `remote: true` rows sit out and why.
      - name: Verify route surface against a local Worker
        run: bun run routes:check

      - name: Validate LWE and Garage page contracts
        run: bun run pages:check

      # Only the DECLARATION tier gates here. It reads shell source and needs no
      # binary present, so it runs anywhere. The presence tier prints what is
      # absent and passes, because a hosted runner carries none of the photo
      # toolchain and never runs the pipeline that wants it.
      - name: Check system tool declaration
        run: bun run tools:check

      - name: Test coffee Worker
        run: bun run --filter cal-aadhar-sh test

      # cf-garage is the ONE project on wrangler's experimental TypeScript config
      # (cf-garage/cloudflare.config.ts), so its dry-run differs from lwe-ask's
      # below in two ways that go together. `--x-new-config` is required on every
      # command that reads the file, and `-c` is REFUSED alongside it, because the
      # loader reads the config from the working directory. That directory is
      # already pinned by `working-directory` above, so dropping `-c` costs
      # nothing. `bun x` is deliberately unchanged: it resolves the .bin shim,
      # whose node shebang runs wrangler under node, which is what the TS config
      # loader requires (it refuses bun by name). See the file's own header.
      - name: Validate Cloudflare garage Worker config
        working-directory: cf-garage
        run: |
          bun test
          bun x --no-install wrangler deploy --dry-run --x-new-config

      - name: Validate LWE ask Worker config
        working-directory: lwe-ask
        run: bun x --no-install wrangler deploy --dry-run -c wrangler.toml

      # The Reader lens Worker. It installs its OWN deps rather than riding the
      # root workspace: defuddle + linkedom are ~22 MB of node_modules that only
      # this Worker bundles, and keeping them out of the root install is what
      # stops them drifting onto the site Worker's dependency surface.
      #
      # pnpm needed --ignore-workspace here and bun needs NOTHING, measured on
      # the parked branch: a bare `bun install` in this directory resolved this
      # package.json alone and created lens-reader/node_modules locally. Do not
      # add a flag looking for parity with the pnpm era; there is nothing left to
      # preserve, and the flag pnpm wanted does not exist here.
      - name: Validate Reader lens Worker config and run its tests
        working-directory: lens-reader
        run: |
          bun install
          bun run typecheck
          bun test
          bun x --no-install wrangler deploy --dry-run -c wrangler.toml

      # infra.json against reality. The tree and DNS tiers need no credential;
      # the account tier runs only when the read-only token secret exists and
      # skips cleanly otherwise. Everything this cannot reach (an unreachable
      # resolver, a missing token) is an advisory, never a failure, so a network
      # blip cannot redden a PR that only touched CSS.
      #
      # LAST on purpose, and it used to be near the front. This is the only step
      # that asserts against LIVE PRODUCTION rather than the tree, so its result
      # depends on the deployed world instead of on the diff. Sequential steps stop
      # at the first failure, so sitting early it did not just redden a PR, it
      # SKIPPED the ten code gates behind it and reported nothing about the change.
      #
      # Measured on 2026-07-31, when a Workers Cache regression on `/` put the
      # production edge out of sync with infra.json: four PRs went red with
      # `Build homepage` through `Validate LWE ask Worker config` all skipped, none
      # of them related to the drift, and one of them (#193) belonged to someone who
      # had no way to know why. Moving it here means a production incident can still
      # redden a PR, which is correct, but every gate that describes the DIFF has
      # already run and reported by then.
      #
      # Still fatal, so drift cannot merge unnoticed. One consequence to know about:
      # a PR whose whole purpose is to FIX production drift cannot turn its own check
      # green before it deploys, because the thing it asserts against is the thing it
      # repairs. That happened the same day (#195) and the documented way out is the
      # local fallback, `bun run deploy`, followed by a re-run.
      # The account id is read out of wrangler.jsonc rather than from a repo
      # variable. This step said `vars.CLOUDFLARE_ACCOUNT_ID` until 2026-08-12 and
      # NO repository variable of that name has ever existed, so it expanded to the
      # empty string on every run.
      #
      # HARDENING, not a repair, and worth saying so because the first version of
      # this comment claimed otherwise. checkApi() falls back to `GET /accounts`
      # and only degrades when the count is not exactly 1; the scoped CI token sees
      # exactly one, so the account tier was asserting normally. Measured on either
      # side of this change: `infra ok: 44 checks passed, 1 skipped or advisory`,
      # the advisory being the CodeQL note, with no `token sees N accounts` warning
      # in either run. The two-account fact belongs to the owner's interactive
      # wrangler login, a DIFFERENT credential from this token.
      #
      # What it buys: a value that cannot be silently empty, cannot drift from the
      # account the deploy targets (it IS that string), and one fewer API call.
      # release-guard.mjs makes the same helper REQUIRED for ramp.yml, where the
      # account id is not optional.
      # Known vulnerabilities across EVERY lockfile in the tree, advisory by
      # design. It reads osv.dev, which aggregates GHSA, NVD and the per-
      # ecosystem databases, so it sees more than the GitHub advisories
      # dependabot alone works from.
      #
      # WHAT IT ACTUALLY BUYS IS TIMING, and this block said something else
      # until 2026-08-14. It claimed `lens-reader` was invisible to dependabot
      # and that its three dependencies had NO vulnerability coverage at all.
      # That is false, and the correction is worth keeping because it turns on a
      # distinction between two dependabot features that read as one:
      #
      #   security ALERTS   come from GitHub's DEPENDENCY GRAPH, which indexes
      #                     every manifest in the repository and does not read
      #                     dependabot.yml at all. Measured 2026-08-14 against
      #                     the manifest of THAT day: defuddle, linkedom,
      #                     turndown and @mixmark-io/domino were all in this
      #                     repo's SBOM. Read that as a dated record rather than
      #                     a current package list, because lens-reader's
      #                     dependency set has been turning over since (defuddle
      #                     left the day this was written) and the bullet's claim
      #                     is about the GRAPH, which no package change touches.
      #                     Alert #13 (extract-zip) was the same finding this
      #                     step reported until the Puppeteer chain left
      #                     cf-garage, so the marginal FINDING count was zero.
      #
      #   version UPDATES   are scoped strictly to the directories dependabot.yml
      #                     lists. lens-reader really was missing there, and the
      #                     fix was five lines in that file rather than this step.
      #
      # What survives is the half that has nothing to do with coverage: a
      # dependabot alert arrives AFTER a merge, and this runs at PR time. That is
      # the whole justification now, and it is enough on its own. The other three
      # lockfiles are scanned anyway, because listing them costs a line and
      # omitting one is how a gap starts.
      #
      # NOT the google/osv-scanner-action: it defaults to `upload-sarif: true`
      # and therefore wants `security-events: write`, which this workflow's
      # permissions block exists to refuse. Downloading the pinned release binary
      # also matches how pnpm is installed above — no action, and one version
      # string rather than a digest to maintain.
      #
      # The checksum is pinned, so tampered or corrupted bytes FAIL rather than
      # run. That is the same reasoning as pinning every action by digest, and it
      # is deliberately a different case from a network blip, which warns and
      # skips.
      #
      # ADVISORY on findings, FATAL on a broken scan, and the split is the point.
      # Exit 1 means real findings, and blocking on those would be wrong here:
      # until 2026-08-16 the one finding was the unfixed extract-zip advisory in
      # cf-garage's Puppeteer chain. The Worker now uses the native Browser Run
      # quick action and that entire chain is gone, but a future advisory must
      # still be reported without training anyone to suppress the scanner. Exit
      # 127 is different: it means the scan never ran, which is this tree's own
      # lockfile paths being wrong, and a scanner that cannot tell "clean" from
      # "did not run" is decoration.
      - name: Scan lockfiles for known vulnerabilities
        env:
          OSV_VERSION: v2.5.0
          OSV_SHA256: edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c
        run: |
          url="https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          if ! curl -sSfL --retry 2 --max-time 180 -o /tmp/osv-scanner "$url"; then
            echo "::warning::could not download osv-scanner ${OSV_VERSION}; skipping the vulnerability scan"
            exit 0
          fi
          if ! echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -; then
            echo "::error::osv-scanner ${OSV_VERSION} did not match its pinned checksum"
            exit 1
          fi
          chmod +x /tmp/osv-scanner
          set +e
          /tmp/osv-scanner scan source \
            --lockfile bun.lock \
            --lockfile lens-reader/bun.lock \
            --lockfile tools/photos/zenc/Cargo.lock \
            --lockfile tools/photos/requirements.txt
          status=$?
          set -e
          case "$status" in
            0) echo "::notice::osv-scanner found no known vulnerabilities" ;;
            1) echo "::warning::osv-scanner found known vulnerabilities; advisory, see the table above" ;;
            *) echo "::error::osv-scanner exited ${status} without completing a scan; a lockfile path is probably wrong"
               exit 1 ;;
          esac

      - name: Resolve the account id from wrangler.jsonc
        run: node tools/print-account-id.ts >> "$GITHUB_ENV"

      - name: Check infrastructure declaration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Rate-limit headroom for the repository-ruleset tier, nothing more.
          # The repo is public, so that endpoint reads without a credential at
          # all; what a token buys is 1000/hr instead of the 60/hr an unauthed
          # read gets per IP, which shared Actions runners can exhaust. The
          # workflow's `contents: read` is enough, and a rate-limited read is an
          # advisory rather than a failure either way. It does NOT unlock the
          # CodeQL assertion; see the permissions note at the top of this file.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run infra:check

      # TRIPWIRE: a ramp parked on the reviewer gate. It lives HERE, outside
      # ramp.yml's concurrency group, because a jam inside that group cannot be
      # reported from inside it. That is not hypothetical: run 31644451923 sat
      # `waiting` for two days and the only visible trace was a handful of
      # cancelled runs that read as housekeeping.
      #
      # What it catches is now DIFFERENT from what it would have caught before
      # 2026-08-14. `cancel-in-progress: true` stopped a parked ramp deleting
      # later releases (ramp.yml's concurrency block has that story). It does
      # nothing about the other half: a canary nobody ever decides on leaves
      # production split 10/90 indefinitely, and no surface anywhere says so.
      #
      # ADVISORY, and deliberately so. Failing here would gate every merge on a
      # state no PR caused, and would deadlock the one PR able to fix a stuck
      # ramp, which is the trap infra:check's edge tier documents at length. It
      # also swallows its own errors: a tripwire that reddens CI when the GitHub
      # API hiccups gets muted, and a muted tripwire is worse than none.
      - name: Warn on a ramp parked at the reviewer gate
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Hours before a parked ramp is worth saying something about. Minutes
          # are the gate working. Overnight is production sitting on a split
          # nobody is watching.
          STALE_HOURS: "6"
        run: |
          set -uo pipefail
          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ramp.yml/runs?status=waiting&per_page=20" \
            --jq '.workflow_runs[] | "\(.id)\t\(.created_at)\t\(.head_sha[0:8])"' 2>/dev/null || true)"
          if [ -z "${runs//[[:space:]]/}" ]; then
            echo "no ramp is parked at the reviewer gate."
            exit 0
          fi
          now="$(date -u +%s)"
          header=0
          while IFS="$(printf '\t')" read -r id created sha; do
            [ -z "${id:-}" ] && continue
            # GNU date, which ubuntu-latest has, parses the ISO-8601 Z form
            # directly. If it ever cannot, fall STALE rather than fresh: an
            # unparseable timestamp defaulting to age 0 would mute the tripwire
            # permanently and look identical to a healthy repo.
            started="$(date -u -d "$created" +%s 2>/dev/null || echo 0)"
            if [ "$started" -eq 0 ]; then
              age="$STALE_HOURS"
              echo "::warning::could not parse ${created}; treating run ${id} as stale"
            else
              age="$(( (now - started) / 3600 ))"
            fi
            if [ "$header" -eq 0 ]; then
              header=1
              {
                echo "## A ramp is parked at the reviewer gate"
                echo ""
                echo "Traffic is split until someone approves or cancels it."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "- run \`${id}\` (\`${sha}\`), waiting ${age}h" >> "$GITHUB_STEP_SUMMARY"
            echo "ramp ${id} (${sha}) has been waiting ${age}h"
            if [ "$age" -ge "$STALE_HOURS" ]; then
              echo "::warning title=Ramp parked ${age}h at the reviewer gate::Run ${id} (${sha}) is still waiting on production-full. Production is on a split nobody has decided. Approve it, or cancel it to free the release path."
            fi
          done <<< "$runs"
          exit 0

      # Does the committed changelog projection still match D1? /updates and
      # /restore are precomputed at BUILD time, so a stale projection ships the
      # previous log and looks fine while being wrong.
      #
      # This was deliberately unwired ("NOT wired into the PR job by default", its
      # own header) because it needs a D1 read. It does not need a NEW credential:
      # `D1:Read` is already one of the six scopes on CLOUDFLARE_API_TOKEN, so this
      # costs nothing but the call.
      #
      # Fatal on drift rather than advisory, which is safe because the script
      # already tells a STAGED release apart from a rewrite: rows above D1's newest
      # that form a contiguous tail are reported as pending, not as drift. So a PR
      # whose whole job is staging v186 passes, and only a row rewritten below D1's
      # newest, or a broken sequence, fails.
      #
      # Tiered on the credential the same way infra:check is. A fork PR cannot read
      # repository secrets, and failing somebody's PR for not holding a token would
      # be a worse check than no check.
      - name: Check the changelog projection against D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice::no CLOUDFLARE_API_TOKEN (fork PR) — skipping the D1 changelog comparison"
            exit 0
          fi
          bun run checkpoints:check
