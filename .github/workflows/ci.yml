name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual re-run, because `validate` is the ONLY required check on main and
  # there was no way to start one that never started. 2026-08-06: an Actions
  # outage ("Failed to resolve action download info. Error: Service
  # Unavailable") left a run stuck in `queued` that the API refused to cancel —
  # "Cannot cancel a workflow run that is completed" — and because the
  # concurrency group below is keyed on the PR number, that zombie swallowed
  # every later event on the same PR. Re-running was impossible (the run "cannot
  # be retried"), closing and reopening the PR fired nothing, and an empty commit
  # fired CodeQL and Workers Builds but not CI. A blocked PR with no lever is a
  # bad place to discover you have no lever.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to validate (defaults to the branch you launch from)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A dispatch deliberately does NOT share the PR's group. The whole reason this
  # trigger exists is to get past a poisoned group, so joining it would inherit
  # the problem it is here to route around.
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # Empty on pull_request/push, where checkout's own default is correct.
          # Only a manual run can name a ref, and then it is the point.
          ref: ${{ inputs.ref || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install homepage dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Wrangler versions and lockfiles
        run: npm run check-wrangler

      - name: Build homepage
        run: npm run build

      - name: Check photo asset invariants
        run: npm run photos:check

      - name: Enforce homepage performance budget
        run: npm run perf-budget

      - name: Validate site Worker config
        run: npx wrangler deploy --dry-run

      - name: Test homepage representation contracts
        run: npm test

      # The route oracle, pre-merge. createTestHarness() boots the site Worker
      # in-process (honouring wrangler.jsonc's build.command, so it serves the
      # minified .build/holding tree) and verify-routes.mjs sweeps it. This is
      # status + content-type + markers for real; it is NOT a data check, since
      # local KV/R2/D1 come up empty. See MAINTENANCE.md "Verify the whole route
      # surface" for what the `remote: true` rows sit out and why.
      - name: Verify route surface against a local Worker
        run: npm run routes:check

      - name: Validate LWE and Garage page contracts
        run: npm run pages:check

      - name: Test coffee Worker
        run: npm test --workspace cal

      - name: Validate Cloudflare garage Worker config
        working-directory: cf-garage
        run: npx wrangler deploy --dry-run -c wrangler.toml

      - name: Validate LWE ask Worker config
        working-directory: lwe-ask
        run: npx wrangler deploy --dry-run -c wrangler.toml

      # infra.json against reality. The tree and DNS tiers need no credential;
      # the account tier runs only when the read-only token secret exists and
      # skips cleanly otherwise. Everything this cannot reach (an unreachable
      # resolver, a missing token) is an advisory, never a failure, so a network
      # blip cannot redden a PR that only touched CSS.
      #
      # LAST on purpose, and it used to be near the front. This is the only step
      # that asserts against LIVE PRODUCTION rather than the tree, so its result
      # depends on the deployed world instead of on the diff. Sequential steps stop
      # at the first failure, so sitting early it did not just redden a PR, it
      # SKIPPED the ten code gates behind it and reported nothing about the change.
      #
      # Measured on 2026-07-31, when a Workers Cache regression on `/` put the
      # production edge out of sync with infra.json: four PRs went red with
      # `Build homepage` through `Validate LWE ask Worker config` all skipped, none
      # of them related to the drift, and one of them (#193) belonged to someone who
      # had no way to know why. Moving it here means a production incident can still
      # redden a PR, which is correct, but every gate that describes the DIFF has
      # already run and reported by then.
      #
      # Still fatal, so drift cannot merge unnoticed. One consequence to know about:
      # a PR whose whole purpose is to FIX production drift cannot turn its own check
      # green before it deploys, because the thing it asserts against is the thing it
      # repairs. That happened the same day (#195) and the documented way out is the
      # local fallback, `npm run deploy`, followed by a re-run.
      - name: Check infrastructure declaration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run infra:check
