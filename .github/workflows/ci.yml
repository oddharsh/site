name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual re-run, because `validate` is the ONLY required check on main and
  # there was no way to start one that never started. 2026-08-06: an Actions
  # outage ("Failed to resolve action download info. Error: Service
  # Unavailable") left a run stuck in `queued` that the API refused to cancel —
  # "Cannot cancel a workflow run that is completed" — and because the
  # concurrency group below is keyed on the PR number, that zombie swallowed
  # every later event on the same PR. Re-running was impossible (the run "cannot
  # be retried"), closing and reopening the PR fired nothing, and an empty commit
  # fired CodeQL and Workers Builds but not CI. A blocked PR with no lever is a
  # bad place to discover you have no lever.
  # Select the branch in GitHub's dispatch UI or with `gh workflow run --ref`.
  # A separate checkout override can run another branch's code with this
  # dispatch's cache scope and misreport which commit was actually tested.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A dispatch deliberately does NOT share the PR's group. The whole reason this
  # trigger exists is to get past a poisoned group, so joining it would inherit
  # the problem it is here to route around.
  #
  # The last fallback is `github.sha`, never `github.ref`. A push to main has no
  # `pull_request.number`, so `github.ref` put every merge into one group named
  # `ci-refs/heads/main` and each one cancelled its predecessor. Measured
  # 2026-08-28 over the last 40 main runs, all of them push: 11 cancelled, 27
  # success, 1 failure, 1 still running. Five died inside 114 seconds on
  # 2026-08-27. A pull_request still groups by PR number, so the runner-minute
  # saving on a force-push to a branch is untouched.
  #
  # Nothing untested can promote: promote-production.yml gates on
  # `conclusion == 'success'`, which a cancelled run never reaches. What was
  # lost is the assertion itself, since for those 11 commits nobody ever said CI
  # passed on main. `cancel-in-progress: false` was rejected here because it
  # serializes a merge train behind this job's own 30-minute timeout.
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # ONE job, since 2026-09-28. It was eight (site, native photos, network,
  # four contract legs crossing bun/node with real/symlinked temp dirs, and a
  # join), which cost about 2 minutes of wall clock and a lot of YAML for a
  # personal site. What stayed is what protects the thing that matters here,
  # the bytes and speed of what ships: the wrangler pin, lint, types, the build
  # with its perf budget, derived-artifact freshness, the route oracle, and the
  # bun suite.
  #
  # What left, and where it went:
  #   node + symlink contract legs  `bun run test:node` still exists locally
  #   network (infra:check, osv, checkpoints:check)  workstation, by hand
  #   native photos (zenc, histograms)  photos.yml, only when photo code moves
  #   auxiliary Worker dry-runs  each Worker's own directory, before deploying it
  #
  # The job is named `validate` because the `main` ruleset requires a check of
  # that name from the GitHub Actions app.
  #
  # PARALLEL STEPS, since 2026-10-06 (Actions `background` and `wait`, GA on
  # 2026-06-25). The steps ran one at a time, about 80s of work whose long
  # poles share nothing: lint 12s, the build 12s, the suite 16s. Independent
  # checks now start in the background, and the critical path is setup, then
  # the build, then the suite. Measured 2026-10-06: the job took a median 74.5s
  # over 12 green main runs (64 to 92) and 50s over 3 runs of this layout (45
  # to 66). Not the 40s the serial sum suggests, because this runner has 4
  # vCPUs and the build and the suite each use several of them. Three
  # ordering edges are real, and
  # contract-ci-required-gate holds each one (gotcha 54):
  #   the suite starts after the build, because eight contract tests read
  #     .build/ and two of them SKIP when it is missing instead of failing
  #   gen-runtime-types finishes before lint and typecheck start, since both
  #     open with it and it deletes, then rewrites, cf-garage's generated types
  #   the suite waits for timbrado's engine (a cold cargo build inside it
  #     raced one test's 30s clock)
  # Flat `background` steps rather than a `parallel:` group: a group nests its
  # steps, which hides their `run:` lines from the tests that read this file,
  # and it has no way to say "the suite waits for the build".
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # wrangler and the route oracle run under node (gotcha 38). It overlaps
      # bun's install; its PATH change lands at the wait below. Bun stays in
      # the foreground because its composite action puts bun on PATH in one
      # inner step and calls it in the next.
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        background: true
        with:
          node-version-file: .node-version

      - name: Set up bun
        uses: ./.github/actions/setup-bun

      - name: Wait for Node.js
        wait: node

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every project that names wrangler must name the root pin and resolve the
      # root install. Back in CI after one day out: #994 reached main still
      # naming f96458c after #991 had moved the root to 3bdcd0d, and the job
      # stayed green. Offline, and about 0.1s, so it runs right after install.
      - name: Check every project uses the root wrangler
        run: bun run check-wrangler

      # `lint` and `typecheck` both open with this generator, and on a fresh
      # checkout it writes config/.generated/ and deletes, then rewrites,
      # cf-garage/.cloudflare/types/. Run concurrently, one reads what the
      # other just deleted. So it runs once, here, and both start after it and
      # find it current. It boots workerd and takes about 9s, which is why it
      # runs beside the build: nothing the build, the route oracle or the suite
      # reads comes from it.
      - name: Generate the Workers runtime types
        id: types
        run: bun tools/gen-runtime-types.ts
        background: true

      # Hashes the INPUTS of every committed derived artifact, so a re-encode
      # that skips a regeneration fails here (gotcha 46). No toolchain needed.
      - name: Check derived artifacts against their inputs
        id: derive
        run: bun run derive:check
        background: true

      - name: Test coffee Worker
        id: cal
        run: bun run --filter cal-aadhar-sh test
        background: true

      # rust-toolchain.toml pins the compiler, and the runner image doesn't
      # ship that version: the first rustc or cargo call made rustup download
      # it, about 8.5s a run. Read the pin from the file, never from
      # `rustup default`, which names the image's stable and is overridden
      # here (keying on it cached the wrong toolchain, 200 MB of it).
      - name: Key the Rust toolchain cache
        id: rust
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          # A channel name (stable, nightly) would freeze whichever build
          # this cache first saw, because the file and so the key never move.
          [[ $channel =~ ^[0-9] ]] || echo "::warning title=Rust pin is a channel::rust-toolchain.toml names '$channel', which keys a cache that never refreshes"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Restore the Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.rust.outputs.channel }}-*
            ~/.rustup/update-hashes/${{ steps.rust.outputs.channel }}-*
          key: rust-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      # timbrado's engine builds into target/ inside the installed package, and
      # a fresh install has none, so every run paid a ~13s cold cargo build.
      # The key names everything that decides the binary: the runner, rustc
      # (restored above), and the package's real path (bun puts the pinned
      # sha in it) plus its Cargo.lock. A bump misses and rebuilds; cargo's fingerprint check still
      # runs on a hit, so a stale restore rebuilds rather than ships.
      - name: Key timbrado's engine cache
        id: timbrado
        run: |
          set -euo pipefail
          pkg=$(realpath node_modules/timbrado)
          echo "target=$pkg/target" >> "$GITHUB_OUTPUT"
          echo "key=timbrado-engine-${RUNNER_OS}-$( { rustc -V; basename "$(dirname "$(dirname "$pkg")")"; cat "$pkg/Cargo.lock"; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore timbrado's engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.timbrado.outputs.target }}
          key: ${{ steps.timbrado.outputs.key }}

      # A cold cargo build; inside the suite it raced one test's 30s clock. So
      # it overlaps the build instead, and the suite waits for it.
      - name: Build timbrado's watch engine
        id: engine
        run: bun -e 'import { ensureTimbradoEngine } from "./tools/lib/upstream-watches.ts"; console.log(ensureTimbradoEngine())'
        background: true

      # perf-budget owns the build and the Worker dry-run; the route oracle
      # below loads that exact bundle. It stays in the foreground: the
      # manifest is cut from what it leaves, and every step after it reads
      # .build/.
      - name: Build, with the performance budget
        run: bun run perf-budget

      # What this build stages, URL by URL, for tools/check-served.ts to compare
      # against production. Cut right after the build, before any later step can
      # touch .build/, and only for a push to main: that is the commit Workers
      # Builds rebuilds and ships, and a pull_request run builds a merge commit
      # nobody deploys. The `attest` job below signs it.
      - name: Cut the served manifest
        if: github.event_name == 'push'
        run: bun run served:manifest --commit "${{ github.sha }}" --out served-manifest.json

      - name: Upload the served manifest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: served-manifest
          path: served-manifest.json
          if-no-files-found: error

      # Report-only, from 2026-10-08: CPU per request on a cold isolate, route by
      # route, scaled to a reference runner and read against each route's ceiling
      # in config/cpu-budget.json (tools/cpu-sweep.ts). It reads .build/.perfbudget
      # and .build/public, writes only .build/cpu-sweep.json, and exits 0 whatever
      # it finds; the table goes to the log and the job summary. Adding --gate
      # makes a route over its ceiling fail the run.
      - name: Report CPU per route
        id: cpu
        run: |
          set -o pipefail
          node tools/cpu-sweep.ts --markdown | tee -a "$GITHUB_STEP_SUMMARY"
        background: true

      # Reads .build/.perfbudget and writes only .wrangler.site.local.jsonc,
      # which nothing in the suite touches, so the two overlap.
      - name: Verify route surface against a local Worker
        id: routes
        run: bun run routes:check --prebuilt .build/.perfbudget
        background: true

      - name: Wait for the runtime types
        wait: types

      # Read-only checks: nothing below writes what they read. oxlint ignores
      # .build/**, and typecheck writes only under --update.
      - name: Lint
        id: lint
        run: bun run lint
        background: true

      - name: Typecheck
        id: typecheck
        run: bun run typecheck
        background: true

      - name: Wait for timbrado's engine
        wait: engine

      - name: Run the contract suite
        run: bun run test

      # Every background step above joins here, and one that failed fails this
      # step by name. Actions would also join them implicitly before post-job
      # cleanup; the explicit step makes the failure read as a check.
      - name: Wait for every background check
        wait-all:

  # CPU per request on a cold isolate, for every registered page and the heavy
  # query routes (tools/route-cpu.ts). Report only, for now: it writes a table
  # to the step summary and cannot fail the run, and --strict is there for when
  # it gates. Its OWN job because, as a background step in validate, it took
  # 76 s and held the required check 40 s past the suite (validate 116 s
  # against 50 to 63 on main, 2026-10-08). The runner itself reads about 2.5x a
  # laptop: the /robots.txt control was 0.98 ms beside the suite and 0.95 ms
  # alone, against 0.38 ms on an M-series Mac, so contention was never the
  # cause and the 8 ms line is not calibrated for this machine yet. It builds
  # its own bundle through perf-budget, the same dry-run validate measures.
  route-cpu:
    name: CPU per route (report)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the dry-run bundle
        run: bun run perf-budget

      - name: Report CPU per route
        run: bun run route-cpu

  # Signs the served manifest: a SLSA build-provenance attestation saying ci.yml,
  # on main, at this commit, produced these URL hashes. tools/check-served.ts
  # verifies it with `gh attestation verify --signer-workflow` before trusting
  # the manifest, so a hand-made file cannot stand in for CI's build.
  #
  # Its own job so the OIDC token never shares a process with repository code:
  # this job checks nothing out and runs only the two pinned actions. And it
  # cannot block a release. promote-production.yml waits for this workflow to
  # COMPLETE, so the attestation exists before any post-release check reads it,
  # and continue-on-error keeps an attestation outage from failing the run that
  # promotes; check-served reports an unattested manifest as a finding instead.
  attest:
    name: attest served manifest
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the served manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: served-manifest

      - name: Attest it
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: served-manifest.json
