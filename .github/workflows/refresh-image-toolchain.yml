name: Refresh image toolchain

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-image-toolchain
  cancel-in-progress: false

jobs:
  refresh:
    name: check and refresh jpegli
    if: github.repository == 'oddharsh/site'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Compare the pinned revision with upstream
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^JPEGLI_COMMIT="${JPEGLI_COMMIT:-\([0-9a-f]\{40\}\)}".*$/\1/p' holding/scripts/build-jpegli.sh)"
          latest="$(git ls-remote https://github.com/google/jpegli.git HEAD | awk 'NR == 1 { print $1 }')"
          [[ "$pinned" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid pinned jpegli revision: $pinned" >&2; exit 1; }
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid upstream jpegli revision: $latest" >&2; exit 1; }
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$pinned" == "$latest" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "jpegli is current at $pinned"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "jpegli update available: $pinned -> $latest"
          fi

      - name: Install and report Homebrew image tools
        run: |
          set -euo pipefail
          brew update --quiet
          brew install cmake exiftool ffmpeg jq libavif mozjpeg ninja webp
          {
            echo "## Homebrew image toolchain"
            echo
            brew list --versions cmake exiftool ffmpeg jq libavif mozjpeg ninja webp
            echo
            echo "Outdated formulas after install (informational; Dependabot does not manage Homebrew):"
            brew outdated --formula --quiet || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pinned revision
        if: steps.upstream.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          set -euo pipefail
          sed -i '' -E "s|^JPEGLI_COMMIT=.*$|JPEGLI_COMMIT=\"\${JPEGLI_COMMIT:-${LATEST}}\"|" holding/scripts/build-jpegli.sh

      - name: Build the candidate jpegli tools
        if: steps.upstream.outputs.changed == 'true'
        env:
          JPEGLI_COMMIT: ${{ steps.upstream.outputs.latest }}
        run: ./holding/scripts/build-jpegli.sh

      - name: Regenerate the encoding evidence
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ./holding/scripts/gen-encoding-samples.sh
          ./holding/scripts/gen-encoding-grids.sh

      - name: Check generated files
        if: steps.upstream.outputs.changed == 'true'
        run: git diff --check

      - name: Open the toolchain update PR
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          PINNED: ${{ steps.upstream.outputs.pinned }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName,number --jq '[.[] | select(.headRefName | startswith("toolchain/jpegli-"))] | .[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "An open jpegli refresh PR already exists: #$existing"
            exit 0
          fi

          branch="toolchain/jpegli-${LATEST:0:12}"
          git switch --create "$branch"
          git add -- holding/scripts/build-jpegli.sh holding/garage/enc
          if git diff --cached --quiet; then
            echo "No toolchain or evidence changes; no pull request needed."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(images): refresh jpegli toolchain"
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "chore(images): refresh jpegli toolchain" \
            --body "$(printf '%s\n' \
              'Automated weekly image-toolchain refresh.' \
              '' \
              "jpegli: $PINNED -> $LATEST" \
              'Regenerates the committed encoding study so file-size and visual diffs are reviewable.' \
              'Homebrew formula versions are reported in the workflow summary; they are not auto-pinned or updated by Dependabot.' \
              '' \
              'Merge through the normal CI and production-promotion path.')"
