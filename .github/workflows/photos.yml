name: Photos

# The native half of what CI used to run on every PR: zenc's tests and clippy,
# then a byte-for-byte reproduction of the committed histograms. It only has
# something to say when the encoder, its lockfile, or the published tiers move,
# so it runs only then. Not a required check; a red run here is still a real
# finding about bytes that ship.

on:
  pull_request:
    paths:
      - "tools/photos/**"
      - "public/i/**"
      - "public/images/**"
      - ".github/workflows/photos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photos-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  native-photos:
    name: native photo validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The libavif config/tools.json records for zenc-avif, which is what the
      # owner's grid tiers link. The distro's libavif is never the oracle: Ubuntu
      # 26.04 ships 1.3.0, whose avifenc writes gray PNGs ~4x dark at -d 10
      # (gotcha 83). tools/contract-photos-ci-builds-the-recorded-libavif.test.ts
      # fails when this tag and the recorded version part.
      LIBAVIF_TAG: v1.4.2
      LIBAVIF_COMMIT: c5240fc79fe5c2407e10afd35f5505ef6333ea49
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up native photo toolchain
        id: native
        # Select the declared compiler BEFORE computing the Rust cache key.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libaom-dev libdav1d-dev libpng-dev libjpeg-dev
          rustup component add clippy
          echo "cache-key=${ImageOS:?}-${ImageVersion:?}-libavif-${LIBAVIF_TAG:?}" >> "$GITHUB_OUTPUT"

      # Static, in its own prefix. A shared build installs a second
      # libavif.so.16 beside any the image carries, and on 26.04 arm64 the
      # loader cache lists /usr/lib first, so both binaries ran 1.3.0 while
      # pkg-config said 1.4.2. Linked in, nothing at run time can swap it. aom
      # and dav1d stay the image's: the parity test compares zenc with avifenc
      # on one library, so the codec version cancels out. About 10 s.
      - name: Build the recorded libavif
        run: |
          src="$RUNNER_TEMP/libavif-src" prefix="$RUNNER_TEMP/libavif"
          git clone --quiet --depth 1 --branch "$LIBAVIF_TAG" https://github.com/AOMediaCodec/libavif.git "$src"
          test "$(git -C "$src" rev-parse HEAD)" = "$LIBAVIF_COMMIT"
          cmake -S "$src" -B "$src/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DBUILD_SHARED_LIBS=OFF -DAVIF_BUILD_APPS=ON -DAVIF_CODEC_AOM=SYSTEM -DAVIF_CODEC_DAV1D=SYSTEM \
            -DAVIF_JPEG=SYSTEM -DAVIF_ZLIBPNG=SYSTEM -DAVIF_LIBYUV=OFF -DAVIF_LIBSHARPYUV=OFF -DAVIF_LIBXML2=OFF
          ninja -C "$src/build" install
          echo "$prefix/bin" >> "$GITHUB_PATH"
          { echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig"; echo "LIBAVIF_STATIC=1"; } >> "$GITHUB_ENV"
          "$prefix/bin/avifenc" --version | grep -F "Version: ${LIBAVIF_TAG#v} "

      - name: Restore compiled Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/photos/zenc -> target
          # The action also keys by job, platform, compiler, flags and Cargo
          # manifests/locks. Include the runner image and native library ABI.
          key: ${{ steps.native.outputs.cache-key }}
          cache-bin: false
          # Rebuild our encoder/C adapter and execute all tests on every run.
          cache-workspace-crates: false

      - name: Test native photo processing
        run: |
          cargo test --locked --manifest-path tools/photos/zenc/Cargo.toml
          cargo run --quiet --locked --manifest-path tools/photos/zenc/Cargo.toml -- --avif-version | grep -F "libavif ${LIBAVIF_TAG#v} "
          cargo clippy --locked --manifest-path tools/photos/zenc/Cargo.toml --all-targets -- -D warnings

      - name: Set up bun
        uses: ./.github/actions/setup-bun

      # Re-bake every photo's histogram with the zenc THIS tree builds and compare
      # it byte for byte with the committed public/images/histograms.json. It is
      # what lets config/derivations.json leave zenc's sources and Cargo.lock out
      # of the histogram digest: a zenc bump is measured here, on the output,
      # instead of reading STALE until somebody re-bakes by hand and re-locks
      # (#871, #985). No credential, no install (the checker imports only node
      # builtins), and the bumped crates already ran in this job's cargo test.
      - name: Reproduce the committed histograms
        run: bun run histograms:check
