name: Test inputs

# Traces which repo paths each contract test file opens (tools/test-inputs.ts),
# so a pull request can run only the files its diff can reach. Nightly on main;
# the map is saved to the Actions cache, which every PR can restore, since a
# PR's cache scope falls back to the default branch.

on:
  schedule:
    - cron: "40 7 * * *" # before ci-trend at 08:20 and the 09:00-10:05 jobs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    name: Trace test inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install strace
        run: sudo apt-get install -y --no-install-recommends strace

      # The suite's own preconditions, as validate builds them: the runtime
      # types, the build, and timbrado's engine.
      - name: Generate the Workers runtime types
        run: bun tools/gen-runtime-types.ts

      - name: Build timbrado's watch engine
        run: bun -e 'import { ensureTimbradoEngine } from "./tools/lib/upstream-watches.ts"; console.log(ensureTimbradoEngine())'

      - name: Build, with the performance budget
        run: bun run perf-budget

      - name: Trace every test file
        run: bun tools/test-inputs.ts trace --out test-inputs.json

      - name: Save the map
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-inputs.json
          key: test-inputs-${{ github.sha }}

      - name: Upload the map
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-inputs
          path: test-inputs.json
