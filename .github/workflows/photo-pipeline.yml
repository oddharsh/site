name: Remote photo pipeline

on:
  workflow_dispatch:
    inputs:
      routine:
        description: "Which image routine should run?"
        required: true
        type: choice
        options:
          - add-photo
          - reencode-thumbnails
          - refresh-metadata
          - add-car-photo
          - regenerate-encoding-study
        default: add-photo
      source_keys:
        description: "R2 object keys, one per line; use all for a full thumbnail re-encode"
        required: false
        type: string
      car_stem:
        description: "For add-car-photo: singer, tuthill, hwa-evo, or f355"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: remote-photo-pipeline
  cancel-in-progress: false

jobs:
  process:
    name: process images remotely
    if: github.repository == 'oddharsh/site'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      ROUTINE: ${{ inputs.routine }}
      SOURCE_KEYS: ${{ inputs.source_keys }}
      CAR_STEM: ${{ inputs.car_stem }}
      PHOTO_SOURCE_ORIGIN: https://aadhar.sh

    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up bun
        # config/... no longer applies: the version lives in packageManager and the
        # action reads it, so there is one declaration of which bun this repo runs.
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install image toolchain
        run: |
          brew install ffmpeg jq libavif mozjpeg webp
          # exif-sooc reads and writes every EXIF the pipeline touches, and
          # replaced exiftool on 2026-08-14. It was NOT installed here when the
          # extractor moved onto it in #390, so this workflow would have failed
          # on its next run. macOS runners ship cargo, as the zenc step below
          # relies on too.
          cargo install --git https://github.com/oddharsh/exif-sooc exif-sooc --locked
          # The venv is for gen-alt-text.py and build-recipes.py, which need
          # python3 and nothing else. requirements.txt is deliberately NOT
          # installed here any more: its one entry is Pillow, the histogram bake
          # moved into zenc on 2026-08-14, and the only remaining Pillow consumer
          # (gen-pixel-peeper.py) is a one-off page generator this workflow never
          # runs. Verified by import, not by assumption.
          python -m venv "$RUNNER_TEMP/photo-venv"
          echo "$RUNNER_TEMP/photo-venv/bin" >> "$GITHUB_PATH"

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Reach halflight, the private crate zenc depends on
        # zenc's resampling kernel is `halflight`, a git dependency on a PRIVATE
        # repository pinned to a rev in Cargo.lock (2026-09-02). This runner's
        # GITHUB_TOKEN is scoped to this repository and cannot read another, so
        # the fetch needs a READ-ONLY deploy key for oddharsh/halflight, stored
        # here as the HALFLIGHT_DEPLOY_KEY secret. No key, no build: this step
        # fails on purpose and says what to create, rather than letting cargo
        # die three steps later on a "could not read from remote" that names
        # nothing. Read-only is the whole point; a deploy key that can write is
        # a second write token in CI, which this repository does not allow.
        env:
          HALFLIGHT_DEPLOY_KEY: ${{ secrets.HALFLIGHT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HALFLIGHT_DEPLOY_KEY:-}" ]; then
            echo "::error::HALFLIGHT_DEPLOY_KEY is not set. zenc depends on the private halflight repository; add a READ-ONLY deploy key to github.com/oddharsh/halflight (Settings > Deploy keys, leave 'Allow write access' off) and store its private half as this repository's HALFLIGHT_DEPLOY_KEY secret."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HALFLIGHT_DEPLOY_KEY" > ~/.ssh/halflight_deploy && chmod 600 ~/.ssh/halflight_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host github.com\n  IdentityFile ~/.ssh/halflight_deploy\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          # .cargo/config.toml at the repo root sets git-fetch-with-cli, so this
          # key is what cargo's fetch uses.
          git ls-remote ssh://git@github.com/oddharsh/halflight.git HEAD > /dev/null

      - name: Build the JPEG encoder (zenc)
        # zenjpeg hybrid + progressive scan search; Cargo.lock pins the graph,
        # dependabot tracks the zenjpeg version (and cannot track the halflight
        # git rev; that pin moves by hand). macOS runners ship cargo.
        run: cargo build --release --locked --manifest-path tools/photos/zenc/Cargo.toml

      - name: Validate routine inputs
        run: |
          set -euo pipefail
          case "$ROUTINE" in
            add-photo|reencode-thumbnails|refresh-metadata)
              [ -n "$SOURCE_KEYS" ] || { echo "source_keys is required for $ROUTINE" >&2; exit 1; }
              ;;
            add-car-photo)
              [ -n "$SOURCE_KEYS" ] || { echo "source_keys is required for add-car-photo" >&2; exit 1; }
              case "$CAR_STEM" in
                singer|tuthill|hwa-evo|f355) ;;
                *) echo "car_stem must be singer, tuthill, hwa-evo, or f355" >&2; exit 1 ;;
              esac
              key_count="$(printf '%s\n' "$SOURCE_KEYS" | awk 'NF { n++ } END { print n + 0 }')"
              [ "$key_count" -eq 1 ] && [ "$SOURCE_KEYS" != "all" ] || { echo "add-car-photo needs exactly one source key" >&2; exit 1; }
              ;;
            regenerate-encoding-study)
              ;;
            *)
              echo "unknown routine: $ROUTINE" >&2
              exit 1
              ;;
          esac

      - name: Download source images from R2
        if: inputs.routine != 'regenerate-encoding-study'
        run: |
          set -euo pipefail
          printf '%s\n' "$SOURCE_KEYS" > "$RUNNER_TEMP/photo-source-keys.txt"
          ./tools/photos/download-remote-photos.sh \
            "$RUNNER_TEMP/photo-source-keys.txt" \
            "$RUNNER_TEMP/photo-source"

      - name: Run the selected photo routine
        env:
          REMOTE_RENDER_ONLY: "1"
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/photo-source"
          case "$ROUTINE" in
            add-photo)
              bun run photos "$source_dir"
              ;;
            reencode-thumbnails)
              ./tools/photos/reencode-thumbnails.sh "$source_dir"
              ./tools/photos/hash-thumbnails.sh
              ./tools/photos/zenc/target/release/zenc histogram --root www
              bun run photos:check
              ;;
            refresh-metadata)
              ./tools/photos/extract-photo-metadata.sh --merge "$source_dir"
              bun run photos:check
              ;;
            add-car-photo)
              key="$(find "$source_dir" -type f -print -quit)"
              [ -n "$key" ] || { echo "no downloaded car source" >&2; exit 1; }
              ./tools/photos/add-car-photo.sh "$CAR_STEM" "$key"
              ;;
            regenerate-encoding-study)
              ./tools/photos/gen-encoding-samples.sh
              ./tools/photos/gen-encoding-grids.sh
              ;;
          esac

      - name: Check generated files
        run: git diff --check

      - name: Open artifact pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$ROUTINE" in
            add-photo) paths=(public/images public/i); title="photos: process remote source batch";;
            reencode-thumbnails) paths=(public/images public/i); title="photos: re-encode remote thumbnails";;
            refresh-metadata) paths=(public/images); title="photos: refresh remote metadata";;
            add-car-photo) paths=(public/cars); title="photos: update remote car image";;
            regenerate-encoding-study) paths=(public/garage/enc); title="garage: regenerate remote encoding study";;
          esac

          branch="photos/remote-$GITHUB_RUN_ID"
          git switch --create "$branch"
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "No generated changes; no pull request needed."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$title"
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body "$(printf '%s\n' \
              'Generated by the Remote photo pipeline workflow.' \
              '' \
              "Routine: $ROUTINE" \
              'Source: R2-backed public photo route' \
              'Encoder: zenjpeg via tools/photos/zenc (Cargo-pinned, dependabot-tracked)' \
              '' \
              'The source files were downloaded to ephemeral runner storage only. Merge this PR through the normal CI and production-promotion path.')"
