# CodeQL, ADVANCED setup. This file replaces the dashboard's default setup,
# which was turned off on 2026-08-15; the two must never both be on, because
# each would analyze the same commit and file duplicate alerts.
#
# Moving to advanced buys one thing this repo cares about disproportionately:
# the language curation becomes a COMMITTED, reviewable file instead of
# dashboard state that only a workstation could read (see the
# `repository.code_scanning` block in config/infra.json). A silent re-enable of
# rust or python used to be invisible to every PR. Now it is a diff.
#
# It also removed the `github-advanced-security` check, which had been red on
# every push since 2026-08-08 (gotcha 27). That was a side effect of disabling
# default setup rather than the reason for it, and it may return.
name: "CodeQL"

on:
  # No pull_request trigger since 2026-11-14. CodeQL is not a required check,
  # so a PR scan could warn but never block, and from 2026-11-07 to 11-14 its
  # 136 PR runs (about 270 runner-minutes) found nothing. A finding now surfaces
  # on the push to main that follows the merge.
  #
  # A push that changes nothing CodeQL reads is skipped, from 2026-11-17. The
  # analyzed set was read off run 44145367917's extraction log: no .lock, .md
  # or image file, and no JSON beyond package.json, tsconfig*.json and one
  # manifest.json, so bun.lock and config/bun-pin.json are never extracted.
  # src/dict holds dictionary copies of served bytes, never served itself, and
  # the init step below drops it from the analysis, so a dictionary roll moves
  # nothing either. 73 of 286 main commits from 2026-10-18 to 11-17 touched
  # only these paths. contract-codeql-skips-only-what-it-never-reads holds the
  # list to that rule; the weekly schedule still re-reads everything.
  push:
    branches: [main]
    paths-ignore:
      - "src/dict/**"
      - "bun.lock"
      - "**/bun.lock"
      - "config/bun-pin.json"
      - "**.md"
      - "public/i/**"
      - "public/images/**"
      - "public/cars/**"
      - "public/og/**"
  schedule:
    # Weekly, matching what default setup ran. Offset off the hour because
    # GitHub queues everything scheduled on :00.
    - cron: "28 17 * * 3"

permissions:
  contents: read
  security-events: write
  # Fetching CodeQL packs.
  packages: read
  # The generator marks this private-repo-only, and this repo is public. It is
  # kept anyway: the `actions` analysis is the one that reads workflow metadata,
  # and a security scanner is a bad place to shave a read permission on a
  # guess. Measure it before removing it, the way ci.yml measured
  # `security-events: read` and then dropped it with a note.
  actions: read

concurrency:
  # Keyed by EVENT PLUS SHA. Keying on `github.ref` put a push to main and the
  # Wednesday schedule into one
  # `codeql-refs/heads/main` group with cancellation on. Any merge landing in
  # the schedule's window killed the weekly scan, and the next one is seven days
  # out. That scan is the only thing that re-reads UNCHANGED code against
  # updated queries, which is how a newly published rule finds an old bug; a
  # pull_request scan only ever sees the diff.
  #
  # `github.sha` on its own leaves the collision open, because a scheduled run
  # and a push can point at the same head commit. `github.event_name` is what
  # separates them. Per-commit isolation matters for pushes here too: both
  # analysis jobs are alert sources, and a cancelled analysis files nothing.
  #
  # Measured 2026-08-28: 10 of the last 23 push runs were cancelled, and the
  # 2026-08-26 scheduled run finished 4m09s before the next merge fired. That
  # run started at 19:24 UTC against a cron of 17:28, so the window it has to
  # survive is not predictable from the schedule.
  group: codeql-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # TWO entries on purpose, and the omissions are the decision. #241
        # dropped `rust` and `python` because between them they cost about 3 of
        # the scan's 4 minutes to analyze four files, all of it workstation and
        # CI build tooling (tools/photos/zenc, gen-pixel-peeper.ts) that never
        # answers a request. That argument rests entirely on the `remote` threat
        # model below: widen the threat model and this list has to be revisited.
        #
        # `javascript-typescript` covers the js/ts/jsx/tsx tree in one analysis.
        # GitHub's default-setup API reports it as three alias languages, which
        # is why config/infra.json declares four names for two jobs.
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The `default` suite, matching what config/infra.json declares.
          # `security-extended` is a large cost change and would need that
          # declaration updated in the same commit.
          #
          # src/dict holds compression dictionaries cut from earlier served
          # bytes, and the build reads them without serving them. CodeQL
          # skipped 116 of its 118 files as minified on 2026-11-17 and analyzed
          # the other two, so an alert in src/client could file once more per
          # stale copy.
          config: |
            paths-ignore:
              - src/dict

      # No manual build step: every language here is `build-mode: none`, so the
      # generator's `exit 1` placeholder would only ever be dead weight.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
          # The database upload feeds GitHub's variant analysis, which nothing
          # here uses. It zipped and uploaded the javascript database on every
          # push: 37 s of that job's 150 s analyze step (run 44145367917,
          # 2026-11-17; 1.4 s for actions). The SARIF upload, which files the
          # alerts, still runs.
          upload-database: false
