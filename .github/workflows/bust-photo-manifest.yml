name: Bust remote photo manifest

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Run after the production Worker has deployed the merged photo PR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bust:
    name: bust manifest KV
    if: inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PHOTOS_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PHOTO_KV_NAMESPACE: 3cb8a107c58e47dc9244e75b33401f36

    steps:
      - name: Check out Wrangler lockfile
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Wrangler
        run: npm ci --no-audit --no-fund

      - name: Delete the manifest value and freshness sentinel
        run: |
          set -euo pipefail
          npx wrangler kv key delete --namespace-id="$PHOTO_KV_NAMESPACE" "manifest:images" --remote
          npx wrangler kv key delete --namespace-id="$PHOTO_KV_NAMESPACE" "manifest:images:fresh" --remote
