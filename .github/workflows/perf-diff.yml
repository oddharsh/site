name: Wire-size diff

# The DIFFERENTIAL performance check, modelled on how astral-sh/ruff runs its
# memory and ecosystem jobs: build the merge base, build HEAD, measure both with
# the same code, post the difference, and fail on nothing.
#
# It lives in its own file rather than joining ci.yml on purpose. `validate` is
# the single required check on `main`, so anything added there becomes a merge
# gate; this is advisory by construction and must never be one. Separate file,
# separate permissions, separate failure domain.
#
# It also does not replace perf-budget.mjs, which runs inside `validate` and
# hard-fails on invariants (twins present, luna.css parses, dictionary coverage).
# The split is: perf-budget answers "is this output structurally valid", this
# answers "did this change move the bytes". Only the second one can catch a slow
# 500-byte-per-PR drift, and only the first one can stop a broken deploy.

on:
  pull_request:
    # Wire size is a function of the served tree and the things that transform
    # it. A README edit or a new photo cannot move a byte the browser downloads,
    # and a job that runs anyway teaches people its result is noise.
    #
    # THIS LIST NAMED `scripts/**` AND ONLY `public/**` UNTIL 2026-08-20, which
    # is the 2026-08-18 layout split arriving here two days late and reading as
    # a job nobody had broken. `scripts/` merged into `tools/`, so the entry
    # matched nothing and a change to build.mjs stopped triggering the diff;
    # every HTML document moved to `src/pages/` and the client assets to
    # `src/client/` + `src/styles/`, so the changes that move the MOST wire
    # bytes stopped triggering it too. A filter that has gone stale fails by
    # going quiet, which is worse than the ERR_MODULE_NOT_FOUND below: nobody
    # investigates a job that did not run.
    paths:
      - "public/**"
      - "src/**"
      - "cal/**"
      - "serendipity/**"
      - "tools/**"
      - "config/site-manifest.json"
      - "wrangler.jsonc"
      - "bun.lock"
      - ".github/workflows/perf-diff.yml"
      # The photo tiers are content-addressed binaries served straight from the
      # edge. They are real bytes, they are just not bytes this measures.
      - "!public/i/**"
      - "!public/images/**"
      - "!public/cars/**"
      - "!public/og/**"
      - "!src/dict/p-dict/**"
      - "!src/dict/a-dict/**"
      - "!**.md"

permissions:
  contents: read

concurrency:
  group: perf-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wire-size:
    name: wire size vs merge base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Scoped to this job, and this job alone. ci.yml's permissions block is
      # deliberately minimal and carries a note about not widening it; this is
      # why the diff got its own file instead of a step over there.
      pull-requests: write

    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed for `git merge-base`. Nothing here pushes, so the credential
          # is not persisted into the local git config either.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bun
        # config/... no longer applies: the version lives in packageManager and the
        # action reads it, so there is one declaration of which bun this repo runs.
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the merge base
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # `fetch-depth: 0` above already populates refs/remotes/origin/*, so
          # this is belt and braces. The explicit refspec matters: fetching a
          # bare branch name updates FETCH_HEAD and leaves origin/<branch> alone,
          # which is the ref `merge-base` is about to read.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          echo "sha=$(git merge-base HEAD "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # BOTH sides get measured by HEAD's copy of the script, which is why it is
      # stashed before the first switch. Two reasons, and the second is the one
      # that bites: the script does not exist at the merge base on the PR that
      # introduces it, and measuring each side with its own copy would report a
      # change to the MEASUREMENT as a change in wire size.
      #
      # THE STASH SITS INSIDE THE REPO, one directory down, and every word of
      # that is load-bearing. Inside, because `tools/lib/wrangler-bin.ts`
      # resolves the pinned wrangler from its OWN path, so a copy under
      # $RUNNER_TEMP points at a node_modules that is not there. One down,
      # because that resolution counts directories and `tools/` is one down.
      # UNTRACKED, because an untracked directory survives both switches, while
      # copying over `tools/` would dirty the tree and abort the switch back to
      # HEAD on "local changes would be overwritten", which is the failure the
      # install note below already records this job hitting once.
      #
      # The whole of `tools/lib` comes along rather than the one file the script
      # imports today, because naming the file is precisely what broke: #481
      # factored the wrangler spawn out into `lib/wrangler-bin.ts`, the stash
      # went on carrying one file, and every PR after it died on
      # ERR_MODULE_NOT_FOUND before measuring a byte.
      - name: Stash the measurement script
        run: |
          rm -rf .perf-measure
          mkdir .perf-measure
          cp tools/perf-snapshot.ts .perf-measure/perf-snapshot.mjs
          cp -R tools/lib .perf-measure/lib

          # Prove the stash before the first switch, because both ways it can be
          # wrong are worse than a failure here. With no arguments the script
          # prints usage and exits 2, so a 2 means every import in its graph
          # resolved and anything else means the copy is short a file.
          status=0
          node .perf-measure/perf-snapshot.mjs >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 2 ]; then
            echo "::error title=incomplete stash::the stashed measurement script does not import cleanly (exit $status)"
            exit 1
          fi

          # And prove the DEPTH, which is the quiet half: a wrong repo root
          # still imports, then spawns a wrangler that is not there, and the
          # script's own catch turns that into "No change, 0 files" in green.
          node --input-type=module -e '
            import { existsSync } from "node:fs";
            const { WRANGLER_ENTRY } = await import("./.perf-measure/lib/wrangler-bin.ts");
            if (!existsSync(WRANGLER_ENTRY)) {
              console.error(`::error title=stash depth::the stash resolves wrangler at ${WRANGLER_ENTRY}, which does not exist`);
              process.exit(1);
            }
            console.log(`stash resolves the pinned wrangler at ${WRANGLER_ENTRY}`);
          '

      # Install with whatever the CHECKED-OUT commit asks for. This workflow
      # builds two different commits in one job, and during a package-manager
      # migration those two want different installers.
      # Install with whatever the CHECKED-OUT commit asks for. This job builds
      # two different commits, and across a package-manager migration those two
      # want different installers. Written to a file the later steps SOURCE,
      # rather than exported through BASH_ENV, because sourcing is visible at
      # the point of use and does not depend on how Actions invokes bash.
      - name: Define the installer
        run: |
          cat > /tmp/installer.sh <<'SH'
          install_for_tree() {
            if [ -f bun.lock ]; then
              bun install --frozen-lockfile
            elif [ -f pnpm-lock.yaml ]; then
              corepack pnpm install --frozen-lockfile
            else
              echo "::warning title=no lockfile::no lockfile at $(git rev-parse --short HEAD), skipping install"
            fi
          }
          SH

      - name: Record the merge base
        env:
          MERGE_BASE: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ steps.base.outputs.head }}
        run: |
          git switch --detach "$MERGE_BASE"
          # Only reinstall when the lockfile actually moved. On the common PR it
          # did not, and a second install is a minute of nothing.
          #
          # ACROSS THE TOOLCHAIN SWAP the two commits disagree about which
          # installer exists at all, so the lockfile in the CHECKED-OUT tree
          # decides. A bun install against a pnpm base writes an untracked
          # bun.lock and edits package.json, and the switch back to HEAD then
          # aborts on "local changes would be overwritten" — which is how this
          # job failed rather than by anything the diff measured.
          if ! git diff --quiet "$MERGE_BASE" "$HEAD_SHA" -- bun.lock pnpm-lock.yaml; then
            source /tmp/installer.sh && install_for_tree
          fi
          node .perf-measure/perf-snapshot.mjs record "$RUNNER_TEMP/base.json" \
            --label "$(git rev-parse --short HEAD)"

      - name: Record HEAD
        env:
          MERGE_BASE: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ steps.base.outputs.head }}
        run: |
          # The install above may have dirtied the base tree with a lockfile
          # that commit never had. Discard it rather than carry it across.
          #
          # `.perf-measure` is excluded BY NAME rather than left to .gitignore.
          # The clean runs while the tree is at the MERGE BASE, and a base older
          # than the commit that added that ignore rule does not carry it, so
          # the stash reads as ordinary untracked cruft and gets deleted between
          # the two records. Measured on this PR's own first run: the base
          # recorded 69 files and HEAD then died on MODULE_NOT_FOUND.
          git checkout -- . && git clean -qfd -e node_modules -e .perf-measure
          git switch --detach "$HEAD_SHA"
          if ! git diff --quiet "$MERGE_BASE" "$HEAD_SHA" -- bun.lock pnpm-lock.yaml; then
            source /tmp/installer.sh && install_for_tree
          fi
          node .perf-measure/perf-snapshot.mjs record "$RUNNER_TEMP/head.json" \
            --label "$(git rev-parse --short HEAD)"

      - name: Compare
        run: |
          node .perf-measure/perf-snapshot.mjs compare \
            "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" \
            --out "$RUNNER_TEMP/wire-size.md"
          cat "$RUNNER_TEMP/wire-size.md" >> "$GITHUB_STEP_SUMMARY"

      # The step summary above is the fallback and always runs. The comment is
      # the thing anyone actually reads, and it is skipped on forks because a
      # `pull_request` from a fork gets a read-only token no matter what this
      # file requests — better to skip it than to fail a job on a permission
      # that cannot be granted.
      - name: Comment the diff on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/wire-size.md
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const marker = "<!-- perf-snapshot-diff -->";
            const body = fs.readFileSync(process.env.REPORT_PATH, "utf8");
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            // Update in place rather than appending. A PR that gets pushed to
            // five times should carry one current diff, not five stale ones.
            const prior = comments.find((comment) => comment.body?.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
