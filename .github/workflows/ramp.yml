name: Ramp production

# Moving traffic, from the repo instead of from a workstation.
#
# The release chain is four links and this file is the last one: CI passes on
# `main` -> promote-production.yml moves the `production` branch -> Workers Builds
# runs `wrangler versions upload`, which builds the commit and mints a servable
# version WITHOUT moving traffic -> something ramps it. That last link was a human
# at a terminal. CLAUDE.md described a `ramp.yml` doing it from 2026-08-06 onward
# and no such workflow was ever written; this is it.
#
# What the ramp buys is the ability to read a change before everyone gets it, so
# automating it must not mean removing the human. It does not:
#
#   canary  10%          `production-canary`, no reviewer, runs on its own
#   full    50% -> 100%  `production-full`, REQUIRED REVIEWER, waits for a click
#
# A merge therefore reaches a tenth of traffic by itself and stops. The rest is a
# person deciding, which is the same decision they were already making, minus the
# terminal.
#
# THE TOKEN. Both ramping jobs need a Cloudflare credential that can write, and
# this is the only place in this repo that holds one. It is an ENVIRONMENT secret
# on the two environments below, never a repo secret, because this repository is
# PUBLIC: Actions secrets are not exposed by a public repo, but a job that runs
# untrusted input can exfiltrate whatever it can read, and a fork PR cannot name
# an environment. Scopes are in CLAUDE.md under the ramp token; the writes need
# Workers Scripts:Edit and D1:Edit, and wrangler wants three reads on top of that
# to identify itself non-interactively. Workers Routes is NOT needed: this shifts
# traffic between versions that already exist and never uploads one.
# The six-read-scope `CLOUDFLARE_API_TOKEN` that infra:check uses is a DIFFERENT,
# read-only credential and this must not widen it.
#
# Ramp steps run through `pnpm run` to match the documented interface, and that
# used to be load-bearing rather than cosmetic: deploy-promote.mjs shelled out to
# `npx wrangler`, and npx resolves whatever it can find. Measured 2026-08-12 in a
# tree with no `node_modules`, `npx wrangler --version` answered 4.105.0 while this
# repo pins 4.120.0, so the wrangler that moved production traffic depended on how
# the script was invoked. It calls `bun x --no-install wrangler` now, which resolves the pin
# on its own, so the choice here is consistency rather than a guardrail.

on:
  workflow_run:
    workflows: [Promote production]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version id to ramp (default: newest production-aliased build)"
        required: false
        type: string
      canary_only:
        description: "Stop at 10% and do not offer the full ramp"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Never two ramps moving traffic at once. Two `wrangler versions deploy` calls
  # interleaving would fight over one split, and the loser's percentages would win
  # by arriving last rather than by being correct.
  #
  # The expression exists because a no-op must not join that group. This workflow
  # fires on `Promote production` COMPLETING, and a skipped promote completes, so
  # every skipped promote spawns a ramp whose canary will decline to run.
  # Concurrency is evaluated BEFORE jobs, so without a group of their own they
  # cannot even reach their own guard: they just sit in the queue. Hence the
  # per-run group, so they start, skip, and end. This condition must stay
  # identical to the `canary` job's `if`; they are the same question asked in two
  # places GitHub does not let you share.
  #
  # `cancel-in-progress` WAS false, and it cost this repo every release between
  # 2026-08-12 and 2026-08-14. The comment it carried said real ramps "share ONE
  # group and queue". They do not queue. A concurrency group holds at most ONE
  # pending run, and each new arrival CANCELS the previously pending one, which
  # `cancel-in-progress: false` does nothing about because that flag governs
  # IN-PROGRESS runs alone. So one ramp parked on the reviewer gate did not delay
  # later releases, it deleted them one at a time, in silence, while production
  # stayed on the stale 10/90 split that same parked run had left behind.
  #
  # Measured 2026-08-14. Run 31644451923 sat `waiting` on `production-full` for
  # two days. Three real ramps died behind it, at 14:49:54, 14:52:55 and 15:11:16,
  # each with ZERO jobs; the last was cancelled at 15:13:17, one second after the
  # next entered the group. Nothing reported a failure, because a cancelled run
  # that never started a job looks like housekeeping.
  #
  # TRUE is the safer setting, which is the opposite of how it reads. What it
  # risks is a cancel landing inside a ramp step, leaving a split nobody chose;
  # those steps are short and the state is both visible and undoable
  # (`deploy:promote --status`, then `--rollback`). Measured on run 31813397643:
  # 26s for the 10% move, 50s for 50->100. What FALSE risked is unbounded, ends in
  # releases disappearing, and is what actually happened. "Newest promoted commit
  # wins" is also the right precedence for a release pipeline: a ramp nobody
  # approved before the next release landed is a ramp that should not finish.
  #
  # THE LOAD-BEARING QUESTION IS ANSWERED, and the answer is yes. This block
  # shipped saying it was NOT measured whether cancel-in-progress reaches a run
  # whose status is `waiting` on an environment gate rather than `in_progress`,
  # and asked for the next release that landed while one was parked. That release
  # was this file's own: run 31820445866 entered the group at 16:40:27 on
  # 2026-08-14 and the parked run 31814961381, `waiting` since 15:32:04, was
  # cancelled at 16:40:28. One second.
  #
  # So this setting is sufficient by itself and the fallback it named, moving
  # `full` into its own workflow so the wait never holds the group, is not
  # needed. Keep the fallback in mind rather than in the tree: it is the answer
  # if GitHub ever narrows cancel-in-progress to `in_progress` alone.
  group: >-
    ${{
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
      && 'production-ramp'
      || format('production-ramp-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  canary:
    name: 10% canary
    # A failed promotion has nothing to ramp, and `workflow_run` fires on failure too.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-canary
      url: https://aadhar.sh
    outputs:
      target: ${{ steps.ramp.outputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_RAMP }}
      VERSION_INPUT: ${{ inputs.version }}

    steps:
      # The PRODUCTION branch, not main. The ramp writes the D1 changelog by
      # diffing the checked-out src/worker/checkpoints.json against D1, so the
      # tree has to be the one that was actually built and uploaded. Reading
      # main's tip would diff against a tree AHEAD of what is serving, which is
      # gotcha 24 with the staleness pointing the other way.
      - name: Check out the promoted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production

      - name: Set up bun
        # config/... no longer applies: the version lives in packageManager and the
        # action reads it, so there is one declaration of which bun this repo runs.
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the account id from wrangler.jsonc
        run: node tools/print-account-id.mjs >> "$GITHUB_ENV"

      # Workers Builds is still building when the promotion workflow finishes, so
      # the version this wants to ramp does not exist yet. deploy:promote's own
      # freshness warning tells a human to "re-run --dry-run until this line
      # clears"; this is that loop. --dry-run resolves and prints the target and
      # moves nothing.
      - name: Wait for Workers Builds to upload the version
        run: |
          set -uo pipefail
          for attempt in $(seq 1 20); do
            out="$(bun run --silent deploy:promote -- --dry-run ${VERSION_INPUT:+--version "$VERSION_INPUT"} 2>&1 || true)"
            printf '%s\n' "$out"
            target="$(printf '%s\n' "$out" | sed -n 's/^target version: *\([0-9a-f]\{8\}\).*/\1/p' | head -1)"
            serving="$(printf '%s\n' "$out" | sed -n 's/^serving now: *//p' | head -1)"
            if [ -n "$target" ] && ! printf '%s' "$serving" | grep -q "$target"; then
              echo "resolved ${target}, which is not serving yet. proceeding."
              exit 0
            fi
            echo "::notice::attempt ${attempt}/20 — no un-served production version yet, waiting 30s"
            sleep 30
          done
          echo "::error::Workers Builds produced no rampable production version within 10 minutes."
          exit 1

      - name: Ramp to 10%
        id: ramp
        run: |
          set -euo pipefail
          out="$(bun run --silent deploy:promote -- --to 10 ${VERSION_INPUT:+--version "$VERSION_INPUT"} 2>&1 | tee /dev/stderr)"
          target="$(printf '%s\n' "$out" | sed -n 's/^target version: *\([0-9a-f]\{8\}\).*/\1/p' | head -1)"
          if [ -z "$target" ]; then
            echo "::error::could not read the ramped version out of deploy:promote's output"
            exit 1
          fi
          echo "target=${target}" >> "$GITHUB_OUTPUT"

      - name: Record the canary
        if: always()
        env:
          TARGET: ${{ steps.ramp.outputs.target }}
        run: |
          {
            echo "## Canary at 10%"
            echo "- version: \`${TARGET:-unresolved}\`"
            echo "- the other 90% is still on the previous version"
            echo ""
            echo "The ramp samples status codes. It cannot tell whether the page is RIGHT."
            echo "Read Workers Logs filtered to \`v=${TARGET:-}\` before approving the full ramp."
            echo ""
            echo "Leaving this parked does NOT hold a queue open. The next release cancels"
            echo "this run and ramps its own version, so an unapproved canary expires"
            echo "quietly rather than blocking what comes after it."
          } >> "$GITHUB_STEP_SUMMARY"

  full:
    name: 50% then 100% (requires approval)
    needs: canary
    if: ${{ !inputs.canary_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      # Required reviewers live on this environment, so this job sits in
      # "Waiting" until a human approves it. That pause IS the ramp.
      name: production-full
      url: https://aadhar.sh
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_RAMP }}
      CANARY: ${{ needs.canary.outputs.target }}

    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production

      - name: Set up bun
        # config/... no longer applies: the version lives in packageManager and the
        # action reads it, so there is one declaration of which bun this repo runs.
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the account id from wrangler.jsonc
        run: node tools/print-account-id.mjs >> "$GITHUB_ENV"

      # THE GUARD THIS JOB EXISTS AROUND. Approval is asynchronous, so minutes or
      # hours pass between the canary and this step, and Workers Builds uploads a
      # version for EVERY push. Re-resolving the newest production build here
      # could therefore ramp something no canary ever read, silently, and every
      # downstream check would pass, because a version that built and deployed
      # returns 200s. So compare against what the canary actually put at 10% and
      # refuse if it moved. Eight hex characters is plenty to detect "a different
      # build appeared"; it is not being used to address anything.
      - name: Refuse to ramp a version the canary never saw
        run: |
          set -euo pipefail
          out="$(bun run --silent deploy:promote -- --dry-run 2>&1 | tee /dev/stderr)"
          now="$(printf '%s\n' "$out" | sed -n 's/^target version: *\([0-9a-f]\{8\}\).*/\1/p' | head -1)"
          if [ "$now" != "$CANARY" ]; then
            echo "::error::newest production version is ${now}, but ${CANARY} was canaried."
            printf '%s\n' \
              "A newer build landed while this ramp waited for approval." \
              "Ramping ${now} would put traffic on something no canary ever read." \
              "Re-run this workflow so it canaries ${now} first, or dispatch it with" \
              "version=${CANARY} if serving the canaried build is what you mean."
            exit 1
          fi
          echo "confirmed: ${now} is the version the canary put at 10%."

      # Ends at 100, which is what makes deploy:promote write the D1 changelog row
      # for this release. Because this checked out `production`, the
      # checkpoints.json it diffs is the one that actually shipped.
      - name: Ramp 50% then 100%
        run: bun run deploy:promote -- --steps 50,100

      - name: Show what is serving
        if: always()
        run: bun run deploy:promote -- --status

  verify:
    name: Post-ramp checks
    needs: full
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No environment and no Cloudflare credential. Both checks below read
    # production over plain HTTPS, which is the whole reason they can run here
    # without widening anything.

    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production

      - name: Set up bun
        # config/... no longer applies: the version lives in packageManager and the
        # action reads it, so there is one declaration of which bun this repo runs.
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The committed dictionaries have to match the bytes production is NOW
      # serving. dictionary-roll.yml opens a PR when they drift; this is the half
      # that NOTICES, immediately after the deploy that could have caused it.
      # Advisory on purpose: a stale dictionary tier is a lost optimisation
      # rather than an outage, and reddening a job after traffic is already at
      # 100% helps nobody.
      - name: Dictionary tiers against live production
        continue-on-error: true
        run: bun run dcz:check

      # Through `env:` rather than `${{ }}` inside the script, for the same reason
      # og-cards.yml does it: an expression is substituted into the script text
      # before bash parses it. This particular value is a hex prefix the canary job
      # matched with a regex, so it is already constrained; the point is that the
      # safe shape should be the habit rather than a judgement call per value.
      - name: Publish the release record
        if: always()
        env:
          TARGET: ${{ needs.canary.outputs.target }}
        run: |
          {
            echo "## Release complete"
            echo "- version at 100%: \`${TARGET}\`"
            echo "- changelog row written to D1 by the 100% step"
            echo ""
            echo "If \`dcz:check\` above is red, the committed dictionaries no longer"
            echo "describe what production serves. dictionary-roll.yml opens a PR for"
            echo "that nightly, or run it now from the Actions tab."
          } >> "$GITHUB_STEP_SUMMARY"
